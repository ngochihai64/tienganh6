}
function radioPlay(t,l,rate,my){
 const s=window.speechSynthesis;loadV();const v=vFor(l||'en-US'),items=radioItems(t,rate);let i=0;_pend=1;
 const next=()=>{if(my!==_tok)return;if(i>=items.length){_pend=0;showStop(false);return}
  const it=items[i++],u=new SpeechSynthesisUtterance(it.t);u.lang=l||'en-US';u.rate=it.r;u.pitch=it.p;u.volume=it.v;if(v)u.voice=v;
  const go=()=>setTimeout(next,it.pause||0);u.onend=go;u.onerror=go;try{s.speak(u)}catch(e){go()}};
 setTimeout(()=>{if(my===_tok)next()},150);
}
function babble(ac,buf,out){const nodes=[];[[450,3.1],[750,4.4],[1050,5.3],[1500,3.7]].forEach(x=>{const s=ac.createBufferSource();s.buffer=buf;s.loop=true;const b=ac.createBiquadFilter();b.type='bandpass';b.frequency.value=x[0];b.Q.value=1.3;const g=ac.createGain();g.gain.value=.02;const o=ac.createOscillator();o.frequency.value=x[1];const og=ac.createGain();og.gain.value=.014;o.connect(og);og.connect(g.gain);s.connect(b);b.connect(g);g.connect(out);s.start();o.start();nodes.push(s,o)});return nodes}

const STOPW=new Set('the a an and or but to of in on at for with from by is are was were be been it its this that these those he she they his her their them as not no yes true false what which who why how when where about after before did does do had has have will would can could should may might more most than then also only very much many some any other into over up down out off too'.split(' '));
const stemW=w=>w.replace(/(ing|ed|es|s)$/,'');
const tokW=s=>((String(s).toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!STOPW.has(w)).map(stemW));
function orderQs(qs,p){
 if(p.ordered)return qs;
 const sents=(String(p.text).match(/[^.!?]+[.!?]*/g)||[]).map(x=>new Set(tokW(x)));
 const keyed=qs.map((q,i)=>{const k=tokW(q.text+' '+(q.k==='mc'?q.opts[q.ok]:(q.ok==='False'?(q.fix||''):'')));let best=-1,bi=1e6;
  sents.forEach((st,j)=>{let n=0;k.forEach(w=>{if(st.has(w))n++});if(n>best){best=n;bi=j}});
  return{q,i,bi:best>0?bi:1e6}});
 keyed.sort((a,b)=>a.bi-b.bi||a.i-b.i);
 return keyed.map(x=>x.q);
}

const SPX={"exploration": [{"title": "Base camp diary", "text": "Okay, so, we left the village at six, or it might have been quarter past, anyway before the sun was properly up. Our guide, Pemba, said the path would take four hours, but he always says that, and it usually means five. I packed a tent, a stove, three jackets and a small radio, though in the end Minh made me leave the radio behind. The first stretch was easy, a wide road with yaks and bells, a bit like a school trip. Then the road became a narrow trail, and on our left there was a drop that I tried hard not to look at. By noon we had reached a bridge made of rope and wooden boards, which swung every time someone took a step. Pemba went first, then Minh, then me, and the woman behind us counted our steps aloud to calm herself. On the far side we stopped for lunch, rice and eggs, not the noodles I had hoped for, but still hot. In the afternoon the air got thinner, and I had a headache, not terrible, more like a tight hat. Pemba told us to drink water every hour, even if we were not thirsty, because the altitude makes people forget. We passed a small stone shrine covered in colourful flags, and Minh left a coin, though I kept mine. At about four the clouds came in from the west, and it got ten degrees colder in minutes. We reached camp at half past five, an hour later than the plan, which Pemba found quite funny. Dinner was soup, and everybody was too tired to talk, apart from the woman who had counted our steps. Tomorrow we climb higher, but we start late, at eight, so I can finally sleep for a whole night.", "qs": [["mc", "When did the group leave the village?", ["Around six or a little after, before sunrise", "Around seven or a little after, before sunrise", "Around six, when the sun was fully up", "A little before five, in the dark"]], ["mc", "What does the guide's \"four hours\" usually mean?", ["About five hours, one more than he says", "About four hours, exactly as he says", "About three hours, less than he says", "About six hours, two more than he says"]], ["mc", "What did Minh make the speaker leave behind?", ["The radio", "The stove", "One of the jackets", "The tent"]], ["mc", "What was the first part of the walk like?", ["Easy, on a wide road with animals", "Easy, on a narrow path with animals", "Difficult, on a wide road with animals", "Easy, on a wide road with other tourists"]], ["mc", "What did the speaker try not to look at?", ["The drop on the left of the trail", "The drop on the right of the trail", "The river in front of the trail", "The cliff above the trail"]], ["mc", "What was special about the bridge?", ["It was made of rope and boards and it swung", "It was made of rope and metal and it swung", "It was made of rope and boards and it was broken", "It was made of stone and it was very narrow"]], ["mc", "Who counted the steps aloud?", ["A woman walking behind them", "A woman walking in front of them", "Pemba, the guide", "Minh, the speaker's friend"]], ["mc", "What was lunch?", ["Hot rice and eggs", "Hot noodles and eggs", "Cold rice and eggs", "Hot rice and soup"]], ["mc", "How did the speaker describe the headache?", ["Mild, like a tight hat", "Strong, like a tight hat", "Mild, like a heavy bag", "Strong, like a heavy bag"]], ["mc", "Why did Pemba say to drink every hour?", ["People forget to drink at high altitude", "People feel too thirsty at high altitude", "The water runs out at high altitude", "The guide is paid to say it"]], ["mc", "What happened at the shrine?", ["Minh left a coin and the speaker kept theirs", "The speaker left a coin and Minh kept theirs", "Both of them left a coin", "Neither left a coin and both took photos"]], ["mc", "What happened at about four?", ["Clouds came from the west and it got much colder", "Clouds came from the east and it got much colder", "Clouds came from the west and it got much warmer", "Clouds came from the west but the temperature stayed the same"]], ["mc", "When did they reach camp?", ["At half past five, an hour behind the plan", "At half past five, exactly on time", "At half past four, an hour ahead of the plan", "At half past six, an hour behind the plan"]], ["mc", "Who was still talking at dinner?", ["Only the woman who counted the steps", "Only Pemba", "Only Minh", "Everybody"]], ["mc", "Why do they start late tomorrow?", ["So the speaker can sleep a whole night", "So the group can avoid bad weather", "Because the path opens at eight", "Because Pemba wants a long breakfast"]]], "ordered": true}, {"title": "Into the cave", "text": "We entered the cave at nine, not at ten as planned, because the guide, Mr Tuan, said the water level would rise after noon. There were six of us, plus Mr Tuan, a photographer called Hoa, and a very quiet man who never told us his name. Each of us wore a helmet with a lamp, and carried a bag with a rope, a whistle and one bottle of water. The first chamber was huge, as tall as a church, and the walls glittered like they were covered in sugar. Mr Tuan said the glitter is calcite, not gold, and that it takes about a hundred years to grow one centimetre. Then we had to crawl through a narrow tunnel, maybe twenty metres long, with only my elbows and knees to help me. Halfway through, Hoa's lamp went out, and for a second it was so dark that I could not see my own hand. Mr Tuan stayed calm, told her to switch on the spare lamp, and we all breathed out. After the tunnel we reached an underground river, ankle deep and so cold that my toes went numb in a minute. We followed the river for about half an hour, and saw small white fish with no eyes, which Mr Tuan called ghosts. At one point we turned off all the lamps for thirty seconds, and the silence was so complete that I could hear my own heart. Near the exit there was a rope ladder, which was easy going up, though my arms were shaking by the end. We came out at half past eleven, into bright light, and everyone was blinking like owls. Mr Tuan counted us twice, and the quiet man was still there, and he finally told us his name was Bao. We celebrated with sticky rice and mango, and I promised myself to come back, but with warmer socks.", "qs": [["mc", "When did they enter the cave, and why?", ["At nine, because the water would rise after noon", "At ten, because the water would rise after noon", "At nine, because Mr Tuan was busy later", "At ten, as planned"]], ["mc", "Who was in the group besides the guide?", ["A photographer and a quiet man", "A doctor and a quiet man", "A photographer and a talkative boy", "Two photographers"]], ["mc", "What did each person carry in the bag?", ["A rope, a whistle and one bottle of water", "A rope, a whistle and two bottles of water", "A rope, a knife and one bottle of water", "A map, a whistle and one bottle of water"]], ["mc", "What was the first chamber like?", ["As tall as a church, with glittering walls", "As tall as a house, with glittering walls", "As tall as a church, with wet walls", "As wide as a church, with dark walls"]], ["mc", "What is the glitter on the walls?", ["Calcite, which grows a centimetre in about a hundred years", "Gold, which grows a centimetre in about a hundred years", "Calcite, which grows a centimetre in about ten years", "Sugar, which grows a centimetre in about a year"]], ["mc", "What was the tunnel like?", ["About twenty metres, crawling on elbows and knees", "About two hundred metres, crawling on elbows and knees", "About twenty metres, walking upright", "About twenty metres, swimming"]], ["mc", "What happened to Hoa's lamp?", ["It went out halfway through the tunnel", "It went out at the entrance", "It broke at the river", "It fell into the water"]], ["mc", "How did Mr Tuan react?", ["He stayed calm and told her to use the spare lamp", "He shouted at her to stay still", "He gave her his own helmet", "He led the group back out"]], ["mc", "What was the river like?", ["Ankle deep and very cold", "Knee deep and very cold", "Ankle deep and warm", "Waist deep and very cold"]], ["mc", " r covered our faces with scarves and told us to walk behind the camels, so the animals would protect us. The storm lasted about forty minutes, though it felt like four hours, and we could hardly see five metres ahead. When it ended, the sky was clear, and the dunes looked completely different, as if someone had redrawn them. We reached the camp at seven, a circle of tents near a small well, with a fire already burning. At night I counted more stars than I had ever seen, then lost count at two hundred, and fell asleep on my back.", "qs": [["mc", "When did they start, and why?", ["Around half past five, because the sand is too hot by eleven", "Around half past six, because the sand is too hot by eleven", "Around half past five, because the camels sleep at noon", "Around half past four, because the sand is too hot by ten"]], ["mc", "What was the speaker's camel like?", ["White, which seemed a joke", "Black, which seemed a joke", "White, and very fast", "Brown, and very slow"]], ["mc", "What was the first hour like?", ["Flat sand with small bushes, and the sky changing colour", "Hills with tall trees, and the sky changing colour", "Flat sand with small bushes, and a blue sky all the time", "Flat sand with rocks, and a red sky"]], ["mc", "How much water did they have?", ["Twenty litres for three people", "Twenty litres for six people", "Two hundred litres for three people", "Ten litres for three people"]], ["mc", "What was the tea like?", ["Mint tea with lots of sugar, more than the speaker likes", "Mint tea with no sugar", "Black tea with lots of sugar", "Mint tea with lots of sugar, which the speaker loves"]], ["mc", "What were the footprints?", ["Small and round, from a fox", "Small and round, from a dog", "Large and long, from a fox", "Small and round, from a camel"]], ["mc", "What did they do at noon?", ["Rested in a tent until three, in forty-four degrees", "Kept walking until three, in forty-four degrees", "Rested until three, in thirty-four degrees", "Rested until two, in forty-four degrees"]], ["mc", "What did they eat while resting?", ["Dates and flat bread", "Rice and flat bread", "Dates and fruit", "Bread and cheese"]], ["mc", "What did the afternoon wind do?", ["Sand got into the eyes, teeth and camera", "Sand got into the eyes and shoes", "Rain got into the camera", "The wind blew the tents away"]], ["mc", "What did Omar tell them to do?", ["Cover their faces and walk behind the camels", "Cover their faces and walk in front of the camels", "Sit on the camels with their eyes closed", "Run to the rocks"]], ["mc", "How long was the storm?", ["About forty minutes, with five metres of visibility", "About four hours, with five metres of visibility", "About forty minutes, with fifty metres of visibility", "About fourteen minutes, with five metres of visibility"]], ["mc", "What was it like after the storm?", ["Clear sky, and the dunes looked different", "Cloudy sky, and the dunes looked the same", "Clear sky, and the dunes were the same", "Dark sky, and no dunes"]], ["mc", "When and where did they reach the camp?", ["At seven, near a small well", "At seven, near a river", "At six, near a small well", "At eight, near a small well"]], ["mc", "What about the fire?", ["It was already burning", "The speaker lit it", "It was not allowed", "It went out in the wind"]], ["mc", "What happened at night?", ["The speaker lost count of the stars at two hundred and slept on their back", "The speaker counted exactly two hundred stars and went into the tent", "The speaker could not see the stars because of clouds", "The speaker lost count at twenty and slept in the tent"]]], "ordered": true}, {"title": "Night walk in the rainforest", "text": "We met the ranger, Ms Thao, at the park gate at seven in the evening, when the light was already going purple. Eight of us came, including two boys of about ten who had brought a torch each and fought over who held it first. Ms Thao gave us three rules, no loud talking, no touching plants, and no flash photography, because it scares the animals. We entered by a narrow path, and within five minutes the noise of the forest was so loud that I could not hear my own steps. There were frogs, insects, something that sounded like a creaking door, and far away a deep call, which Ms Thao said was a gibbon. First we saw a stick insect, which looked exactly like a twig until it moved, and half the group jumped. Then Ms Thao pointed her torch at a leaf, and we saw a small green snake, thin as a pencil, asleep around a branch. She explained that it was not dangerous, though she would not let anyone touch it. After half an hour we reached a stream, and she asked us to switch off all the torches for a minute. In the dark, the mushrooms on a fallen tree began to glow, a pale green, like something from a film. I did not know that fungi can glow, and Ms Thao said that scientists still argue about why they do it. On the way back, a large owl landed on a branch above our heads, stared at us, and flew away without a sound. One of the boys whispered, that was the best thing I have ever seen, which made everyone smile. We finished at nine, and the ranger counted us, eight, and gave us each a cup of ginger tea. I walked to the car park with a strange feeling that the forest had been watching us the whole time.", "qs": [["mc", "When and where did they meet the ranger?", ["At seven in the evening, at the park gate", "At seven in the morning, at the park gate", "At six in the evening, at the park gate", "At seven in the evening, at the ranger station"]], ["mc", "Who was in the group?", ["Eight people, including two boys of about ten", "Eight people, including two girls of about ten", "Ten people, including two boys of about eight", "Eight people, including two boys of about twelve"]], ["mc", "What were the three rules?", ["No loud talking, no touching plants, no flash photography", "No loud talking, no touching animals, no flash photography", "No walking, no touching plants, no flash photography", "No loud talking, no touching plants, no torches"]], ["mc", "Why was flash photography not allowed?", ["It scares the animals", "It wakes the plants", "It breaks the cameras", "It is too bright for people"]], ["mc", "What was the forest like inside?", ["Very loud, with frogs, insects and a gibbon far away", "Very quiet, with only a gibbon", "Very loud, with frogs and birds", "Quiet, with a creaking door"]], ["mc", "What was the stick insect like?", ["It looked like a twig until it moved, and half the group jumped", "It looked like a leaf until it moved, and half the group jumped", "It looked like a twig and did not move", "It looked like a snake until it moved"]], ["mc", "What was the snake like?", ["Small, green, thin as a pencil, asleep on a branch", "Small, brown, thin as a pencil, asleep on a branch", "Large, green, thick as an arm, asleep on a branch", "Small, green, thin as a pencil, awake on the ground"]], ["mc", "What did Ms Thao say about the snake?", ["It was not dangerous, but nobody could touch it", "It was dangerous, so nobody could touch it", "It was not dangerous, so everybody could touch it", "It was dangerous, but everybody could touch it"]], ["mc", "What happened at the stream?", ["After half an hour, the torches were switched off for a minute", "After an hour, the torches were switched off for a minute", "After half an hour, the torches were kept on for a minute", "After half an hour, the torches were switched off for ten minutes"]], ["mc", "What happened to the mushrooms?", ["They glowed pale green on a fallen tree", "They glowed pale blue on a fallen tree", "They glowed pale green on a stone", "They did not glow"]], ["mc", "What do scientists say about glowing fungi?", ["They still argue about why they glow", "They know exactly why they glow", "They are not interested", "They say the fungi glow for people"]], ["mc", "What did the owl do?", ["Landed above their heads, stared and flew away silently", "Landed on the path and made a loud noise", "Flew past without stopping", "Landed on Ms Thao's arm"]], ["mc", "What did one of the boys say?", ["It was the best thing he had ever seen", "It was very scary", "He wanted to go home", "Nothing"]], ["mc", "How did the walk end?", ["At nine, with ginger tea", "At ten, with ginger tea", "At nine, with coffee", "At eight, with ginger tea"]], ["mc", "How did the speaker feel at the end?", ["That the forest had been watching them", "That they were lost", "That the ranger was following them", "That the forest was boring"]]], "ordered": true}], "feelings": [{"title": "Waiting for results", "text": "I could not sleep last night, not because of noise, more like my brain would not switch off. At two I got up and made a hot chocolate, then at three, or maybe half past, I finally fell asleep on the sofa. In the morning Mum said I looked pale, and I said it was just the light, which was a lie. The exam results come out at four in the afternoon, not in the morning like my cousin told me, and that is the worst part, waiting all day. I tried to distract myself, first with a film, then with a walk, but I kept checking the clock. My best friend Lan texted me three times, always something silly, a joke about teachers, a photo of her cat, then a heart. Dad pretended to be calm, but he washed the car twice, and he never washes it, so I knew he was nervous too. At lunch I could only eat half a sandwich, even though it was my favourite, cheese and tomato. Around three I felt strangely calm, like the sea before a storm, or maybe like a person who has given up. I opened the website at four sharp, and it showed an error, which made me laugh and cry at the same time. Ten minutes later it worked, and my English mark was higher than I expected, a B plus, not an A, but I did not care. My maths was lower, a C, which I will probably have to explain to Mum, but she will understand. I called Lan first, before my parents, and she screamed so loudly that I had to hold the phone away. Dad hugged me for a long time, and I think his eyes were a bit wet, though he said it was the onions. Tonight we are going out for pizza, my choice, and I am still deciding between mushrooms and pineapple, though I know Dad hates pineapple.", "qs": [["mc", "Why could the speaker not sleep?", ["Their mind would not stop working", "Their room was too noisy", "Their room was too hot", "They were hungry"]], ["mc", "When did they fall asleep?", ["Around three or half past, on the sofa", "Around two, in bed", "Around four, on the sofa", "Around three or half past, in bed"]], ["mc", "What happened when Mum said they looked pale?", ["They blamed the light, which was not true", "They blamed the noise, which was true", "They agreed they were tired", "They said they felt fine and went out"]], ["mc", "When do the results come out?", ["In the afternoon, not in the morning", "In the morning, as the cousin said", "In the afternoon, as the cousin said", "In the evening, not in the morning"]], ["mc", "How did they try to distract themselves?", ["First a film, then a walk", "First a walk, then a film", "First a film, then a game", "First music, then a walk"]], ["mc", "What did Lan send?", ["A joke, a photo of her cat and a heart", "A joke, a photo of her teacher and a heart", "A joke, a photo of her cat and a song", "Three jokes and a photo of her cat"]], ["mc", "How did the speaker know Dad was nervous?", ["He washed the car twice, which he never does", "He washed the car once, as he always does", "He cleaned the kitchen twice, which he never does", "He drove the car twice, which he never does"]], ["mc", "How much lunch did the speaker eat?", ["Half a cheese and tomato sandwich", "A whole cheese and tomato sandwich", "Half a cheese and ham sandwich", "Half a pizza"]], ["mc", "How did the speaker feel around three?", ["Strangely calm, maybe like someone who has given up", "Very excited and happy", "Even more scared than before", "Angry with their father"]], ["mc", "What happened at four?", ["The website showed an error and they laughed and cried", "The website worked and they cried", "The website showed an error and they got angry", "The website stayed closed until five"]], ["mc", "What was the English mark?", ["A B plus, higher than expected", "An A, higher than expected", "A B plus, lower than expected", "A B, higher than expected"]], ["mc", "What was the maths mark?", ["A C, lower than the English mark", "A C, higher than the English mark", "A B, lower than the English mark", "A D, lower than the English mark"]], ["mc", "Who did they call first?", ["Lan, before their parents", "Mum, before Lan", "Dad, before Lan", "Their cousin, before Lan"]], ["mc", "Why did Dad say his eyes were wet?", ["He blamed the onions", "He blamed the wind", "He blamed tiredness", "He blamed a film"]], ["mc", "What is the speaker deciding about the pizza?", ["Mushrooms or pineapple, and Dad dislikes pineapple", "Mushrooms or pineapple, and Dad dislikes mushrooms", "Cheese or pineapple, and Dad dislikes pineapple", "Ham or mushrooms, and Dad dislikes ham"]]], "ordered": true}, {"title": "A surprise visit", "text": "I thought it was going to be a boring Saturday, until my doorbell rang at ten past ten, and I opened it in my pyjamas. It was my cousin Duc, who lives in Da Nang, and I had not seen him for nearly two years. He had a big bag, a guitar and a huge smile, and he said he was staying for just three days, not a week as he first planned. For about ten seconds I could not speak, I just stood there with my mouth open like a fish. Then I hugged him so hard that he dropped the guitar, which was, luckily, in a soft case. Mum came out of the kitchen with flour on her hands, and she cried a little, and then pretended it was the flour in her eyes. Duc said he had wanted to surprise us, and that Aunt Lien helped him buy the ticket secretly. I was a bit angry at first, because everyone knew except me, but the anger disappeared after one minute. We ate breakfast late, pancakes with honey, and Duc told us about his new job at a hotel. He said he works nights, which is hard, but that the guests are friendly and the tips are good. In the afternoon we went to the park, and he played the guitar while I tried, badly, to sing. A little girl clapped, though she was probably only three, and she clapped at all the wrong moments. In the evening I felt a strange sadness, because I knew he would leave on Tuesday, and time moves faster when you are happy. Before bed, Duc said that next year I should visit him, and that he would show me the beach. I could not sleep for ages, but this time because I was too happy, not too nervous, which is a big difference.", "qs": [["mc", "When did the doorbell ring?", ["At ten past ten", "At ten to ten", "At ten past nine", "At ten past eleven"]], ["mc", "Who was at the door?", ["A cousin who lives in Da Nang", "A cousin who lives in Hue", "An uncle from Da Nang", "A friend from Da Nang"]], ["mc", "How long is Duc staying?", ["Three days, less than he first planned", "A week, as he first planned", "Three days, as he first planned", "Three weeks, longer than planned"]], ["mc", "How did the speaker react at first?", ["Stood silently with their mouth open", "Shouted with joy", "Ran to tell Mum", "Closed the door"]], ["mc", "What happened to the guitar?", ["It was dropped, but it was in a soft case", "It was dropped and it broke", "It was kept safe, but the case broke", "It was given to Mum"]], ["mc", "What did Mum do?", ["Cried a little and blamed the flour", "Laughed and blamed the flour", "Cried a lot and said nothing", "Shouted at Duc"]], ["mc", "Who helped Duc buy the ticket?", ["Aunt Lien", "Mum", "Uncle Lien", "The speaker's father"]], ["mc", "How did the speaker's anger go?", ["A little at first, gone after a minute", "Strong, and lasted all day", "None at all", "Small, and lasted until the evening"]], ["mc", "What was breakfast?", ["Pancakes with honey, eaten late", "Pancakes with jam, eaten late", "Pancakes with honey, e lue with silver stars, though honestly it is a bit too sparkly for my taste. Backstage it was so hot and crowded that I felt dizzy, and my hands were so cold that I could hardly hold the microphone. There were seven acts before us, a magician, two dancers, a boy with a violin, a comedian and two others I did not see. The comedian told a joke about teachers, and everyone laughed so much that the floor seemed to shake. Then it was our turn, and Ha whispered, breathe, and we walked onto the stage, which was brighter than I imagined. For the first ten seconds my voice was shaky, and my mouth felt like cotton, and I thought, I am going to forget everything. But I saw Mum in the third row, holding up a small sign she had made, with a heart, and I smiled and the words came back. By the second verse I was almost enjoying it, and I even made a mistake, singing a wrong word, but nobody noticed. At the end there was applause, longer than I expected, and a girl in the front shouted my name. We bowed, and my knees were shaking, and for a moment I wanted to laugh and cry together. Backstage Ha hugged me and said, we did it, and I realised that I had not breathed properly for three minutes. We did not win, the magician won, but my teacher said we got the loudest applause, which is a kind of prize. When I got home I was so tired that I fell asleep in my dress, with the silver stars all over my pillow.", "qs": [["mc", "What is the song like?", ["A pop song, three minutes, with Ha on the piano", "A pop song, three minutes, with Ha on the guitar", "A rock song, three minutes, with Ha on the piano", "A pop song, five minutes, with Ha on the piano"]], ["mc", "How did they practise?", ["Six weeks, twice a week, mostly after school", "Six weeks, three times a week, mostly after school", "Two weeks, twice a week, mostly after school", "Six weeks, twice a week, mostly at lunch"]], ["mc", "What is the dress like?", ["Light blue with silver stars, a bit too sparkly", "Light blue with gold sta ich a woman sold from a basket, and it was cheaper than the cakes. We arrived at ten to nine, almost an hour late, but nobody seemed upset, everyone just stretched and smiled. Our hotel is five minutes from the station, so we decided to walk, even though the bags were heavy. Tomorrow we plan to visit the old palace, but only if it does not rain, and the forecast says maybe.", "qs": [["mc", "When will the train really leave?", ["At twenty-five past eight", "At twenty past eight", "At ten past eight", "At twenty-five to nine"]], ["mc", "Which platform is the train on?", ["Platform four, changed from six", "Platform six, changed from four", "Platform four, as on the ticket", "Platform eight, changed from four"]], ["mc", "Who carries the snacks?", ["The sister", "The mother", "The speaker", "The father"]], ["mc", "Where are their seats?", ["Carriage nine, by the window", "Carriage eight, by the window", "Carriage nine, by the door", "Carriage eight, by the door"]], ["mc", "How long is the journey?", ["About twelve hours", "About ten hours", "About eight hours", "About fifteen hours"]], ["mc", "How many cakes did Mum buy?", ["Three, though she says she is on a diet", "Two, though she says she is on a diet", "Three, because she was hungry", "Four, because the man gave her one free"]], ["mc", "What can the speaker see outside at night?", ["Mostly their own face and a few lights", "Many bright city lights", "The sea and boats", "Nothing, because the window is covered"]], ["mc", "Why did the train stop around midnight?", ["For half an hour, because another train had broken down", "For an hour, because another train had broken down", "For half an hour, because of bad weather", "For ten minutes, because of a broken door"]], ["mc", "What did the speaker tell the sister?", ["That they were only halfway", "That they were nearly there", "That they had just left", "That they had already arrived"]], ["mc", "What happened with the blanket?", ["Mum first refused, then accepted", "Mum r tonight, and she gave me a small bag with a toothbrush, soap and a white T-shirt. My brother laughed and said the T-shirt was so big that I could use it as a tent. Outside, the air was hot and sticky, thirty-four degrees, and the taxi driver turned the air conditioning up to maximum. The hotel was near a canal, on the fifth floor, with a view of a market and a very noisy motorbike repair shop. In the evening we found a street stall selling spicy noodles, and I burned my mouth, so I drank three bottles of water. When we got back, the receptionist handed me a note, saying the suitcase would come at ten, a little earlier than I had expected. I slept badly, partly because of the heat, partly because I kept imagining my suitcase on a plane to somewhere else. In the morning, at ten to ten, a boy knocked at the door with my red suitcase, and I could have kissed him, honestly.", "qs": [["mc", "How early did the plane land?", ["Forty minutes early", "Forty minutes late", "Fourteen minutes early", "An hour early"]], ["mc", "What was the immigration queue like?", ["About an hour, with a singing child", "About ten minutes, with a singing child", "About an hour, with a crying child", "About two hours, with a singing child"]], ["mc", "What happened at the baggage claim?", ["The brother's black case came first, the speaker's did not", "The speaker's red case came first, the brother's did not", "Both cases came together", "Neither case came"]], ["mc", "What was left on the belt?", ["A pushchair and a box tied with string", "A pushchair and a red suitcase", "A box and a black suitcase", "Two boxes tied with string"]], ["mc", "How did the speaker describe the suitcase?", ["Large, red, with a yellow ribbon", "Large, red, with a yellow label", "Small, red, with a yellow ribbon", "Large, black, with a yellow ribbon"]], ["mc", "Where was the suitcase sent?", ["Probably Singapore, where they changed planes", "Probably Hanoi, where they started", "Probably Bangkok, in another terminal", d town", "text": "We arrived in the old town at three, which is a bad time, because everything is hot and crowded. My phone map showed our hotel two streets away, but the streets are tiny and the names are impossible. We asked a man selling lanterns, and he pointed left, then right, then said something very fast that I did not understand. After twenty minutes we ended up at a bridge, which was not at all on my map. A woman with a bicycle explained, using her hands, that the bridge is the one near the market, and the hotel is behind it. So we went back, and this time we found a yellow house with a green door, which she had described as the hotel. But it was not a hotel, it was a tailor's shop, and the owner laughed and offered us tea. He said the hotel was next door, the white one, and that his cousin owns it, which seems to be the case with everything in this town. At the desk, the receptionist said our room was not ready, so we left our bags and went for lunch. We chose a tiny restaurant by the river, ordered white rose dumplings and a noodle dish with pork, and shared a mango juice. The bill was three hundred thousand dong, more than I expected, until I realised that it included two extra dishes the waiter had brought by mistake. The waiter refused to take them back, and said they were a gift, for being lost tourists. In the evening the lanterns were lit, and the whole river turned red, yellow and green, and suddenly I forgave the streets. We floated a candle on the water and made a wish, which I will not tell, or it will not come true. At nine we walked back to the hotel, this time without a map, and found it in three minutes.", "qs": [["mc", "When did they arrive in the old town?", ["At three, when it was hot and crowded", "At four, when it was hot and crowded", "At three, when it was cold and quiet", "At two, when it was hot and quiet"]], ["mc", "How far was the hotel on the map?", ["Two streets away", "Two kilometres away", "Twenty streets away", "Next to the  a town for lunch, and Dad lost twenty minutes looking for parking, which made Mum sigh, loudly. In the afternoon the traffic became heavy near the coast, and in the end the journey took eight hours with all the stops, though without them it would have been six, as Grandma had predicted. She did not say I told you so, but her smile said it very clearly. We reached the hotel at half past two, tired and hungry, and my brother ran straight to the beach in his clothes.", "qs": [["mc", "When did they leave, and why is it special?", ["Half past six, which is a miracle for Dad", "Half past seven, which is a miracle for Dad", "Half past six, which is normal for Dad", "Half past five, which is a miracle for Dad"]], ["mc", "Who is in the car?", ["Five people, including Grandma and the little brother", "Four people, including Grandma", "Five people, including an uncle", "Six people, including Grandma"]], ["mc", "What was the boot like?", ["So full that Dad had to sit on the suitcase", "So empty that there was extra space", "So full that they used the roof", "So full that Mum sat on the suitcase"]], ["mc", "What were the estimates for the journey?", ["About three hundred kilometres: Dad four hours, Mum five, Grandma six", "About three hundred kilometres: Dad five hours, Mum four, Grandma six", "About thirty kilometres: Dad four hours, Mum five, Grandma six", "About three hundred kilometres: Dad six hours, Mum five, Grandma four"]], ["mc", "When did the brother ask if they were there yet?", ["After an hour, when they had only just passed the petrol station", "After two hours, when they had only just passed the petrol station", "After an hour, when they had almost arrived", "After half an hour, when they had only just passed the petrol station"]], ["mc", "What was breakfast?", ["Sticky rice in banana leaves, too sweet for Grandma", "Sticky rice in banana leaves, too salty for Grandma", "Noodles in banana leaves, too sweet for Grandma", "Sticky rice in paper, too sweet for Grandma f past one, the brother ran to the beach in his clothes", "At half past two, the brother went to sleep"]]], "ordered": true}], "shopping": [{"title": "At the return counter", "text": "Hello, I bought this jacket last Saturday, or maybe Friday, anyway, less than a week ago. The label says medium, but it feels like a small, and the sleeves are far too short. I paid forty-five dollars, and I only have the receipt on my phone, not a paper one. The assistant said that is fine, but they do not have the same jacket in large, only in extra large. Extra large would be too big, I think, like wearing a tent, so I asked about the green one on the other rack. The green one is a large, but it costs fifty-five, ten more than mine, and it is the last one in the shop. I tried it on, and honestly, the colour is nicer than the grey one, though the zip feels a bit stiff. The assistant offered ten percent off because of the stiff zip, which brings it down to about fifty dollars, well, almost. So I would pay only five dollars more, roughly, which sounded fair, and I did not argue. Then she asked whether I wanted a bag, and I said no, because I brought my own, the blue one with the cartoon bear. She scanned my card, and the machine made a strange noise, so we had to try twice. Meanwhile a man behind me was sighing loudly, probably in a hurry, though he was holding only one pair of socks. At the end she gave me a new receipt and said I could return the jacket within fourteen days if I changed my mind. I thanked her and walked out happy, though I forgot to ask whether the shop is open on Sunday. Anyway, my sister says green is not my colour, so maybe I will be back next week!", "qs": [["mc", "When did the speaker buy the jacket?", ["Friday or Saturday, less than a week ago", "Thursday or Friday, more than a week ago", "Saturday or Sunday, less than a week ago", "Friday or Saturday, more than two weeks ago"]], ["mc", "What is wrong with the jacket?", ["It is too small and the sleeves are too short", "It is too big and the sleeves are too long", "It is too small and the zip is broken", "It is the wrong colour and the sleeves are too short"]], ["mc", "How did the speaker show the receipt?", ["On their phone", "On paper", "With a bank statement", "They had no receipt"]], ["mc", "What did the assistant say about the grey jacket?", ["There is no large, only extra large", "There is a large and an extra large", "There is only a small", "There is only a large"]], ["mc", "Why did the speaker not want extra large?", ["It would be far too big", "It would be far too expensive", "It would be too short", "It would be too bright"]], ["mc", "What is the green jacket like?", ["A large, ten dollars more than theirs", "A large, five dollars more than theirs", "An extra large, ten dollars more than theirs", "A large, ten dollars less than theirs"]], ["mc", "What did the speaker think of the green jacket?", ["Nicer than the grey one, but with a stiff zip", "Uglier than the grey one, but with a stiff zip", "Nicer than the grey one, but with a missing button", "The same as the grey one, with a stiff zip"]], ["mc", "What did the assistant offer?", ["Ten percent off because of the zip", "Twenty percent off because of the zip", "Ten percent off because it was the last one", "A free bag because of the zip"]], ["mc", "How much more would the speaker pay?", ["Roughly five dollars", "Roughly ten dollars", "Roughly fifty dollars", "Nothing at all"]], ["mc", "What kind of bag did the speaker use?", ["Their own blue bag with a bear", "Their own green bag with a bear", "A blue bag from the shop", "No bag at all"]], ["mc", "What went wrong at the payment?", ["The machine made a noise and they tried twice", "The card was refused three times", "The machine was switched off", "The assistant lost the card"]], ["mc", "What was the man behind the speaker doing?", ["Sighing, with only a pair of socks", "Sighing, with lots of clothes", "Arguing with the assistant", "Talking on the phone"]], ["mc", "How long can the jacket be returned?", ["Within fourteen days", "Within seven days", "Within thirty days", "Within twenty-one days"]], ["mc", "What did the speaker forget to ask?", ["Whether the shop is open on Sunday", "Whether the shop is open on Saturday", "Whether the zip can be repaired", "Whether the shop sells hats"]], ["mc", "Why might the speaker come back?", ["Their sister thinks green does not suit them", "Their sister wants a bigger size", "The zip may break", "The price may fall next week"]]], "ordered": true}, {"title": "Bargaining at the market", "text": "Right, so we are at the market, and my aunt says never accept the first price, never, not even for a pen. The woman at the first stall wanted sixty thousand dong for a straw hat, which my aunt said was robbery. They argued in a friendly way for five minutes, and finally agreed on forty, but my aunt made her add a ribbon. At the next stall there were silk scarves in three colours, blue, green and a sort of orange, and the price was one hundred and twenty. My aunt said she would take two for one hundred, and the man laughed and said no way, so we walked away slowly. This is the secret, she whispered, you always walk away slowly, because the seller will call you back. And indeed, after about ten steps, he shouted, one hundred and ten for two, last offer, and she said deal. I chose the green scarf and the orange one, though my sister would probably want the blue. Then we looked at spices, a tiny bag of pepper which smelled amazing, and my aunt bought two bags, one for her and one for Mum. The vendor tried to sell me a wooden spoon, saying it was handmade, but I could see a label that said factory. I did not say anything, I just smiled and put it down, and my aunt nodded proudly. Around noon it got really hot, and we stopped for sugar cane juice, which cost ten thousand a glass and was worth every coin. On the way out, I bought a small notebook for myself, forty thousand, and I did not bargain, because the girl selling it looked about my age. My aunt shook her head, but then said that sometimes kindness is a good bargain, too. We carried six bags to the bus, and I think we spent more than we saved, but it was a lot of fun.", "qs": [["mc", "What is the aunt's rule?", ["Never accept the first price", "Always accept the first price", "Never buy before noon", "Always buy two things"]], ["mc", "What was the first price of the hat?", ["Sixty thousand dong", "Forty thousand dong", "Sixteen thousand dong", "One hundred thousand dong"]], ["mc", "What was the final deal for the hat?", ["Forty thousand, with a ribbon added", "Fifty thousand, with a ribbon added", "Forty thousand, with a flower added", "Forty thousand, with nothing added"]], ["mc", "What colours were the scarves?", ["Blue, green and orange", "Blue, green and red", "Blue, yellow and orange", "Pink, green and orange"]], ["mc", "What did the aunt first offer for two scarves?", ["One hundred, against his one hundred and twenty", "One hundred and ten, against his one hundred and twenty", "One hundred, against his one hundred and ten", "Ninety, against his one hundred and twenty"]], ["mc", "What is the aunt's secret?", ["Walk away slowly so the seller calls you back", "Walk away quickly so the seller follows", "Stay and argue longer", "Ask for a discount twice"]], ["mc", "What was the final price of the scarves?", ["One hundred and ten for two", "One hundred for two", "One hundred and twenty for two", "One hundred and ten for one"]], ["mc", "Which scarves did the speaker choose?", ["Green and orange", "Green and blue", "Blue and orange", "Only green"]], ["mc", "What happened with the pepper?", ["Two bags, one for the aunt and one for Mum", "Two bags, both for the aunt", "One bag for Mum", "Three bags, one for the sister"]], ["mc", "What was wrong with the wooden spoon?", ["A label said factory, though it was sold as handmade", "A label said handmade, though it was broken", "It was too expensive", "It was too sma too many grey things, so I chose the refund, but then I remembered the match on Sunday. I needed new shoes before Sunday, so I asked whether he could send the grey ones by express, and he said yes, for an extra five dollars. I said no, that is not fair, since it was their mistake, and after a short silence he said he would not charge the five dollars. So I got the grey trainers at ten percent off, delivered on Saturday morning, for free, which felt like a small victory. When they arrived, the box was dented, but the shoes were perfect, and they fit well, even a bit better than the white ones would have. I sent the sandals back, using the label he emailed me, and I even put a note inside saying, please read the order next time.", "qs": [["mc", "What did the speaker order?", ["White trainers with a blue stripe, size forty-one, due in three days", "White trainers with a blue stripe, size forty-three, due in three days", "Blue trainers with a white stripe, size forty-one, due in three days", "White trainers with a blue stripe, size forty-one, due in thirteen days"]], ["mc", "What happened on Thursday?", ["Nothing came, and the tracking said in transit", "The parcel arrived, and the tracking said delivered", "Nothing came, and the tracking said cancelled", "The parcel arrived damaged"]], ["mc", "What was in the Friday parcel?", ["A smaller box with brown sandals, size thirty-eight", "A bigger box with brown sandals, size thirty-eight", "A smaller box with brown sandals, size forty-one", "A smaller box with black sandals, size thirty-eight"]], ["mc", "What did the speaker find when checking the order?", ["The right number and address, but the wrong product", "The wrong address, but the right product", "The wrong number, but the right product", "Everything was correct"]], ["mc", "What happened on the phone first?", ["The speaker waited ten minutes with music", "The speaker spoke at once to a fast talker", "The speaker left a message", "The speaker waited an hour"]], ["mc", "title": "A supermarket list", "text": "Mum gave me a shopping list, with twelve things, and a budget of fifty dollars, which she said was generous. First the vegetables, two kilos of potatoes, a bunch of spring onions, and tomatoes, but only the firm ones, not the soft ones. The potatoes were three dollars a kilo, and there was a special offer, buy two kilos, get one free, so I took three kilos for six dollars. For the tomatoes I chose a small bag, four dollars, and checked every one, like Mum does, and the lady next to me smiled. Then the dairy aisle, a litre of milk, a big yoghurt and cheese, but not the cheapest one, because Mum says that one tastes like soap. The milk was two dollars, the yoghurt three, and the cheese seven, which seemed expensive, so I looked at the label again. Then I discovered that the seven dollars was for a pack of two, which is actually a good price. I went to the bakery, where the bread was still warm, and I took a loaf and four rolls, for breakfast tomorrow. Mum had written, do not buy sweets, but I stood in front of the chocolate for one full minute, and left it, proudly. At the meat counter I asked for half a kilo of chicken, and the man said, with or without skin, and I had no idea, so I phoned Mum. She said without, and also that the receipt must be kept, in case anything is wrong. At the checkout the total was thirty-nine dollars and fifty cents, but I noticed one mistake. The cashier had scanned the yoghurt twice, so I pointed it out politely, and she corrected it, and thanked me. The new total was thirty-six dollars fifty, and with a fifty dollar note the change was thirteen dollars fifty, so Mum will be happy, since I did not buy chocolate. Outside, I realised I had forgotten the twelfth item, the washing powder, which is of course the heaviest, so I went back.", "qs": [["mc", "What did Mum give the speaker?", ["A list of twelve things and a budget of fifty dollars", "A list of ten things and a budget of fifty dollars", "A list of twelve things and a budget of forty dollars", "A list of twelve things and a budget of fifteen dollars"]], ["mc", "What rule was there for the tomatoes?", ["Only the firm ones", "Only the soft ones", "Only the red ones", "Only the small ones"]], ["mc", "What was the potato deal?", ["Three kilos for six dollars with the offer", "Two kilos for six dollars", "Three kilos for nine dollars", "Three kilos for three dollars"]], ["mc", "What did the lady next to the speaker do?", ["Smiled when the speaker checked every tomato", "Laughed at the speaker", "Gave advice about the cheese", "Took the best tomatoes"]], ["mc", "What was the rule about the cheese?", ["Not the cheapest, because it tastes like soap", "Only the cheapest one", "Not the most expensive one", "Only the biggest one"]], ["mc", "What was the cheese price like?", ["Seven dollars for a pack of two, a good price", "Seven dollars for one, too expensive", "Seventeen dollars for a pack of two", "Seven dollars for a pack of three"]], ["mc", "What did the speaker buy at the bakery?", ["A warm loaf and four rolls for breakfast tomorrow", "A warm loaf and four cakes for tomorrow", "A cold loaf and four rolls for breakfast", "Two loaves and four rolls"]], ["mc", "What did the speaker do about the chocolate?", ["Stood in front of it for a minute, then left it", "Bought it", "Did not look at it", "Bought two bars"]], ["mc", "What happened at the meat counter?", ["Half a kilo of chicken, and Mum said without skin", "One kilo of chicken, and Mum said without skin", "Half a kilo of chicken, and the speaker decided alone", "Half a kilo of chicken, and Mum said with skin"]], ["mc", "What did Mum say about the receipt?", ["Keep it in case anything is wrong", "Throw it away", "Show it to the cashier", "It was not needed"]], ["mc", "What was the first total?", ["Thirty-nine dollars fifty", "Thirty-six dollars fifty", "Forty-nine dollars fifty", "Thirty-nine dollars"]], ["mc", "What mistake did the speaker notice?", ["The yoghurt was scanned twice, and the speaker pointed it out politely", "The milk was scanned twice, and the speaker pointed it out politely", "The cheese was scanned twice, and the speaker pointed it out politely", "The yoghurt was scanned twice, but the speaker said nothing"]], ["mc", "What was the final total and change?", ["Thirty-six fifty, with thirteen fifty change", "Thirty-nine fifty, with ten fifty change", "Thirty-six fifty, with fourteen fifty change", "Thirty-three fifty, with sixteen fifty change"]], ["mc", "Why will Mum be happy?", ["The speaker did not buy chocolate", "The speaker bought extra cheese", "The speaker spent the whole budget", "The speaker kept the change"]], ["mc", "What did the speaker forget?", ["The washing powder, the heaviest item", "The washing-up liquid, the lightest item", "The rice, the heaviest item", "The salt, the lightest item"]]], "ordered": true}], "environment": [{"title": "Beach clean-up", "text": "We met at seven on Sunday morning, not eight like the poster said, because the organiser wanted to beat the heat. About forty people came, mostly students, plus a few parents and one very serious dog. Each group got a bag, gloves, and a long stick with a pointed end, which looks scary but is actually practical. My group started at the north end, near the rocks, where the sand is dark and full of tiny pieces of plastic. We found bottles, mostly water bottles, then lots of straws, a flip-flop and, believe it or not, a toothbrush. A girl called Mai said that the tide brings most of it, not the tourists, which surprised me. After an hour we had filled six bags, though the organiser had hoped for ten. Then we sorted everything, plastic on the left, glass in the middle and metal on the right, with a separate box for the strange stuff. The strangest item was a boot, a single rubber boot, size forty-two, with a small crab living inside. We let the crab go, obviously, and Mai put it back in a shallow pool near the rocks. At ten a local fisherman brought us coconut water, which was a nice surprise, as nobody had asked him. He said that twenty years ago the beach was cleaner and the fish were bigger, but now the nets keep bringing up plastic. The organiser weighed everything, and the total was about eighty kilos, a record for this beach. Next month they plan a similar event at the river, but they need more volunteers, especially people with boats. I signed up, even though I get seasick, because I think a river is calmer than the sea.", "qs": [["mc", "When did the volunteers meet?", ["At seven, earlier than the poster said", "At eight, as the poster said", "At seven, as the poster said", "At nine, later than the poster said"]], ["mc", "Who came to the clean-up?", ["About forty people, mostly students", "About fourteen people, mostly students", "About forty people, mostly parents", "About four hundred people, mostly students"]], ["mc", "What was the long stick like?", ["It looks scary but helps pick up rubbish", "It looks scary and is used against animals", "It looks harmless but is not useful", "It looks scary and is only for the organiser"]], ["mc", "What was the north end like?", ["Dark sand with tiny pieces of plastic", "White sand with tiny shells", "Dark sand with large rocks only", "White sand with plastic bottles"]], ["mc", "Which list of finds is correct?", ["Bottles, straws, a flip-flop and a toothbrush", "Bottles, straws, a flip-flop and a phone", "Bottles, bags, a flip-flop and a toothbrush", "Cans, straws, a shoe and a toothbrush"]], ["mc", "According to Mai, what brings most of the rubbish?", ["The tide", "The tourists", "The fishermen", "The rain"]], ["mc", "How many bags did they fill in an hour?", ["Six, fewer than the ten hoped for", "Ten, as hoped", "Six, more than the four hoped for", "Sixteen, more than hoped"]], ["mc", "How did they sort the rubbish?", ["Plastic left, glass middle, metal right", "Plastic left, metal middle, glass right", "Glass left, plastic middle, metal right", "Metal left, glass middle, plastic right"]], ["mc", "What was the strangest item?", ["A single rubber boot with a crab inside", "A pair of rubber boots with a crab inside", "A single rubber boot with a fish inside", "A single leather shoe with a crab inside"]], ["mc", "Where was the crab put?", ["In a shallow pool near the rocks", "Into the open sea", "In a bucket of water", "On the sand near the bags"]], ["mc", "Who brought the coconut water?", ["A fisherman, without being asked", "The organiser, as planned", "A fisherman, because the students paid", "A student, without being asked"]], ["mc", "What did the fisherman say?", ["Twenty years ago the beach was cleaner and fish bigger", "Ten years ago the beach was cleaner and fish bigger", "Twenty years ago the beach was dirtier and fish smaller", "Twenty years ago the beach was cleaner but fish smaller"]], ["mc", "What was the total weight?", ["About eighty kilos, a record", "About eighty kilos, below the record", "About eighteen kilos, a record", "About eight hundred kilos, a record"]], ["mc", "What is the next event?", ["At the river, with volunteers who have boats", "At the beach, with more students", "At the river, with more dogs", "At the lake, with volunteers who have boats"]], ["mc", "Why did the speaker sign up despite getting seasick?", ["They think a river is calmer than the sea", "They love boats", "Their friend asked them", "It is near their house"]]], "ordered": true}, {"title": "Our school garden", "text": "Our school garden started last spring, on a patch of dry ground behind the gym where nothing but weeds had grown for years. Mrs Lan, the biology teacher, had the idea, and twelve students joined at first, though now we have about thirty. First, we had to clear the stones, which took two weeks, not one as we hoped, because the ground was harder than expected. Then we brought compost from the canteen, mostly vegetable peel and coffee grounds, which smells awful but makes the soil rich. We planted tomatoes, peppers, beans and some herbs, mint and basil, but the beans were the first to grow. In June there was a week without rain, and we carried water in buckets every morning before class. A boy called Khoa suggested collecting rainwater from the gym roof, and the caretaker helped fix a barrel and a pipe. Now the barrel fills up in one good storm, about two hundred litres, enough for the whole garden for a week. In July the peppers were attacked by small green insects, and we did not want to use chemicals. Mrs Lan suggested garlic spray, which smells horrible, but it worked within three days, and the ladybirds also helped. By September we had our first real harvest, about ten kilos of tomatoes, which we sold at the school fair for a small price. With the money, we bought two new tools and a sign, and we saved the rest for seeds. The canteen now uses some of our herbs, and the cook says they taste better than the ones from the shop. Next year we want to plant fruit trees, maybe lemons or guavas, but Mrs Lan says we must first prove we can keep the garden alive. I think we can, because it has become my favourite place at school, quiet, green, and somehow always smelling of rain.", "qs": [["mc", "Where is the garden?", ["On dry ground behind the gym", "On a roof behind the gym", "On wet ground in front of the gym", "On dry ground behind the library"]], ["mc", "How many students joined at first, and now?", ["Twelve at first, about thirty now", "Thirty at first, about twelve now", "Twelve at first, about twenty now", "Twenty at first, about thirty now"]], ["mc", "How long did clearing the stones take?", ["Two weeks, longer than hoped", "One week, as hoped", "Two weeks, as hoped", "Two months, longer than hoped"]], ["mc", "What was the compost made of?", ["Vegetable peel and coffee grounds from the canteen", "Fruit peel and tea leaves from the canteen", "Vegetable peel and coffee grounds from the shop", "Vegetable peel and eggshells from home"]], ["mc", "Which plant grew first?", ["Beans", "Tomatoes", "Mint", "Peppers"]], ["mc", "What happened in June?", ["A week without rain, so they carried water", "A week of storms, so they covered the plants", "Two weeks without rain, so they carried water", "A week without rain, so they used a hose"]], ["mc", "What was Khoa's idea?", ["Collect rainwater from the gym roof", "Collect rainwater from the canteen roof", "Use water from the river", "Buy a pump"]], ["mc", "What can the barrel hold, and how long does it last?", ["Two hundred litres, enough for a week", "Two hundred litres, enough for a day", "Twenty litres, enough for a week", "Two thousand litres, enough for a month"]], ["mc", "What was the problem in July?", ["Insects on the peppers, and no chemicals wanted", "Insects on the tomatoes, and no chemicals wanted", "Insects on the peppers, and chemicals used", "Birds on the peppers, and no chemicals wanted"]], ["mc", "How was the problem solved?", ["Garlic spray worked in three days, helped by ladybirds", "Garlic spray worked in a week, helped by ladybirds", "Soap spray worked in three days", "Garlic spray did not work"]], ["mc", "What was the first harvest?", ["About ten kilos of tomatoes, sold at the school fair", "About ten kilos of beans, sold at the school fair", "About twenty kilos of tomatoes, given to the canteen", "About ten kilos of tomatoes, eaten by students"]], ["mc", "How was the money used?", ["Two tools and a sign, the rest saved for seeds", "Two tools and a table, the rest saved for seeds", "Two signs, the rest given to charity", "Seeds only"]], ["mc", "What does the cook say about the herbs?", ["They taste better than the shop's", "They taste worse than the shop's", "They are too expensive", "They are the same as the shop's"]], ["mc", "What is the plan for next year?", ["Fruit trees, but first they must prove they can keep the garden alive", "Fruit trees, and Mrs Lan has already agreed", "Flowers, but first they need more money", "More vegetables, but first they need a bigger garden"]], ["mc", "How does the speaker feel about the garden?", ["It is their favourite place, quiet and green", "It is their favourite place, busy and noisy", "It is a place they dislike", "It is a place only for lessons"]]], "ordered": true}, {"title": "The recycling challenge", "text": "Our class has started a recycling challenge, which lasts a month, and the winner gets a trip to the science museum. There are four teams, Red, Blue, Green and Yellow, and each team collects plastic, paper and cans in three different bins. I am in the Green team, with Minh, Anna and a quiet boy called Tai, and our first mistake was a big one. We put a greasy pizza box in the paper bin, and Mrs Hoa told us that oil makes paper impossible to recycle. So the box went into the general rubbish, and we lost two points, which hurt our pride more than our score. In the second week we found out that bottle tops should be removed, because they are made of a different plastic. Tai had a clever idea, to collect the tops separately and make something, so we started a jar for them. By the third week the jar was full, and we made a colourful mosaic for the school entrance, a fish with blue and white scales. The Red team did something different, they collected old books and gave them to a village library, which Mrs Hoa praised a lot. The Yellow team, on the other hand, cheated a little, because they took cans from the canteen bin, which was not allowed. When it was discovered, they lost ten points and were not happy at all. At the end of the month the scores were Red ninety-two, Green eighty-eight, Blue seventy-five, and Yellow sixty-one. We came second, only four points behind, which was a bit disappointing, but the mosaic got a special prize. The prize was a small plant for every member of the team, and I put mine on the window, where it already looks happier than me. The best part is that, since the challenge, my mother recycles at home too, and she even corrects my father when he forgets.", " nd we use it for the plants, which now look very happy. In the kitchen Mum washes vegetables in a bowl, not under the tap, and she pours the same water on the garden afterwards. The washing machine is the biggest user, so Mum waits until it is full, and has stopped using it for just three shirts. We also discovered a leak, a tap in the garden that dripped one drop every second, which Dad fixed with a new washer that cost fifty cents. I calculated that this tiny drip wasted about five litres a day, nearly two thousand a year, which shocked Dad, and the scepticism disappeared. After one month our daily average fell from four hundred to about three hundred, a saving of one quarter, and the bill dropped too. Dad says the money saved will pay for a barbecue, which is a bit funny, since the point was the river, not the meat. Next month we want to try collecting rainwater from the roof, and my brother wants to name the barrel Barry.", "qs": [["mc", "How much water does the family use?", ["About four hundred litres a day", "About forty litres a day", "About four thousand litres a day", "About one hundred and forty litres a day"]], ["mc", "What did Dad and Mum think?", ["Dad was sceptical because water is cheap, and Mum agreed because the river is lower", "Dad agreed, and Mum was sceptical", "Both were sceptical", "Dad said the river is lower, and Mum said water is cheap"]], ["mc", "What did the speaker used to do when brushing teeth?", ["Leave the tap running for two minutes", "Leave the tap running for ten minutes", "Use a cup", "Brush for five minutes"]], ["mc", "How much does turning off the tap save?", ["About ten litres each time, which the speaker measured", "About one litre each time, which the speaker measured", "About twenty litres each time, which the speaker estimated", "About ten litres a day, which the speaker estimated"]], ["mc", "What happened with the brother's showers?", ["Ten minutes became five, and he complained the water was cold, though it was not", "F e and sleep on it, again.", "qs": [["mc", "How long has the speaker been deciding?", ["About a week", "About a month", "About two days", "About a year"]], ["mc", "What is wrong with the old phone?", ["It is three years old and the battery dies by lunchtime", "It is two years old and the battery dies by lunchtime", "It is three years old and the screen is broken", "It is three years old and the battery dies by evening"]], ["mc", "How much does Phone A cost?", ["Three hundred and fifty dollars", "Two hundred and eighty dollars", "Four hundred and twenty dollars", "Three hundred and five dollars"]], ["mc", "What is Phone B like?", ["Cheaper, with a smaller screen and an average battery", "Cheaper, with a bigger screen and an average battery", "More expensive, with a smaller screen", "Cheaper, with a smaller screen and a great battery"]], ["mc", "What is said about Phone C?", ["The most expensive, and may last five years", "The cheapest, and may last five years", "The most expensive, and may last two years", "The most expensive, with the best battery"]], ["mc", "Why does the speaker not listen to the brother?", ["He only photographs his dinner", "He never uses a phone", "He wants the cheapest phone", "He prefers old phones"]], ["mc", "How often does the speaker charge the old phone?", ["Three times a day", "Twice a day", "Once a day", "Four times a day"]], ["mc", "Which order of battery life, best to worst, is correct?", ["A, then C, then B", "C, then A, then B", "A, then B, then C", "B, then C, then A"]], ["mc", "What is surprising to the speaker?", ["The most expensive phone does not have the best battery", "The cheapest phone has the best battery", "Phone A has no battery", "Phone C has no screen"]], ["mc", "What are the free headphones like?", ["Wireless, and the speaker often loses them", "Wired, and the speaker often breaks them", "Wireless, and the speaker never uses them", "Big, and the speaker likes them"]], ["mc", "What does the speaker ask for instead?", ["A esson was more important than the argument. When I came back, the lesson had moved on to a quiz, and I missed the first two questions. I answered the third one correctly, a question about verbs, and Mr Hung gave me a thumbs up. After the call, I wrote down three rules, update the laptop the night before, test the microphone, and talk to my brother early. I think I will also buy a better router someday, but maybe not before my next birthday.", "qs": [["mc", "What time was the call, and how long was the update said to take?", ["Four o'clock, thirty minutes", "Four o'clock, forty minutes", "Five o'clock, thirty minutes", "Four o'clock, ten minutes"]], ["mc", "How long did the update really take?", ["Forty minutes, so they were late", "Thirty minutes, so they were on time", "Forty minutes, but they were still early", "One hour, so they missed the lesson"]], ["mc", "What was the first problem in the call?", ["They could see everyone but nobody could hear them", "They could hear everyone but nobody could see them", "Nobody could see or hear anything", "The teacher was absent"]], ["mc", "What did the message say?", ["No microphone found", "No camera found", "No internet found", "The microphone is broken"]], ["mc", "What did the cousin advise?", ["Unplug the headset and plug it back in", "Restart the laptop", "Buy a new headset", "Call the teacher"]], ["mc", "What was wrong with the sockets?", ["Pink is for the microphone and green for sound, and they were swapped", "Green is for the microphone and pink for sound, and they were swapped", "Pink is for the microphone and green for sound, and they were correct", "Pink and green are both for sound"]], ["mc", "What happened after the sound worked?", ["The voice was too quiet and they were asked to speak louder three times", "The voice was too loud and they were asked to speak softer", "The voice was too quiet and they were asked twice", "The voice was normal"]], ["mc", "Why was the internet slow?", ["The brother was watching a f ine. My little sister asked it to tell a joke, and it said, why did the computer go to the doctor, because it had a virus. She laughed for five minutes, and made it repeat the joke nine times. Then Dad asked for the weather, and Luna said it would rain on Tuesday, but be sunny on Monday and Wednesday. I asked for a song by my favourite band, and it played a different one, with a similar name, which was very annoying. Mum tried to set a timer for the rice, ten minutes, and Luna set it for fifteen, so the rice was soft, almost soup. We discovered that Luna understands Dad best, perhaps because he speaks slowly and clearly, while we all talk at once. On Sunday morning Luna woke us all at six, because Dad had set an alarm for a fishing trip, which he forgot. He was furious with the speaker, though it was his own mistake, and Mum laughed so much that she cried. I asked whether the speaker listens all the time, and Dad said only when you say its name, but I am not completely sure. For that reason I have decided to say please and thank you, just in case, even if it is only a machine. Despite all the problems, I admit it is useful, especially for the weather, and for homework, when I ask for a word in English.", "qs": [["mc", "What does Dad say about the speaker?", ["It will change our lives, though so far it only changes the music", "It will save us a lot of money", "It is cheap but useless", "It is only for children"]], ["mc", "What is the speaker like?", ["A small grey cylinder, bought last weekend", "A small black cylinder, bought last weekend", "A small grey box, bought last weekend", "A small grey cylinder, bought last month"]], ["mc", "When and how did Dad set it up?", ["On Saturday night, with his phone", "On Sunday morning, with his laptop", "On Saturday night, with a book", "On Friday night, with his phone"]], ["mc", "How long did the setup take?", ["One hour, not ten minutes like the box said", "Ten minutes, as the box said", "One hour, as the box said", "Two hours, not ten minutes"]], ["mc", "What is the voice and name?", ["A calm woman's voice, called Luna, which Mum finds too romantic", "A calm man's voice, called Luna, which Mum finds too romantic", "A calm woman's voice, called Luna, which Mum loves", "A loud woman's voice, called Luna, which Mum finds too romantic"]], ["mc", "What happened with the joke?", ["The computer went to the doctor because of a virus, and the sister asked for it nine times", "The computer went to the doctor because of a cold, and the sister asked for it nine times", "The computer went to the doctor because of a virus, and the sister was not amused", "The computer went to school because of a virus, and the sister asked for it nine times"]], ["mc", "What did Luna say about the weather?", ["Rain on Tuesday, sun on Monday and Wednesday", "Rain on Monday, sun on Tuesday and Wednesday", "Rain on Tuesday, sun on Thursday and Friday", "Rain on Wednesday, sun on Monday and Tuesday"]], ["mc", "What went wrong with the music?", ["It played a different song with a similar name", "It played the right song too quietly", "It said it could not find the band", "It played nothing"]], ["mc", "What went wrong with the timer?", ["Mum asked for ten minutes, Luna set fifteen, and the rice went soft", "Mum asked for fifteen minutes, Luna set ten, and the rice was hard", "Mum asked for ten minutes, Luna set ten, and the rice was perfect", "Mum asked for ten minutes, Luna set fifty, and the rice burned"]], ["mc", "Who does Luna understand best?", ["Dad, who speaks slowly and clearly", "Mum, who speaks softly", "The sister, who speaks loudly", "The speaker, who speaks fast"]], ["mc", "What happened on Sunday morning?", ["Luna woke them at six for Dad's forgotten fishing trip", "Luna woke them at seven for Mum's work", "Luna woke them at six for school", "Luna played music at six for the sister"]], ["mc", "How did Dad and Mum react?", ["Dad was furious at the speaker, and Mum laughed until she cried", "Dad laughed, and M radioItems=function(text,rate){
 const sents=String(text).replace(/\s*\n+\s*/g,' ').match(/[^.!?]+[.!?]*/g)||[String(text)],out=[];

  const isQ=/\?\s*$/.test(c);

  for(let i=0;i<cl.length-1;){if(cl[i].split(' ').length<3){cl[i+1]=cl[i]+' '+cl[i+1];cl.splice(i,1)}else i++}
  if(cl.length>1&&cl[cl.length-1].split(' ').length<2){cl[cl.length-2]+=' '+cl.pop()}
  let slurDone=false;
  cl.forEach((x,k)=>{
   const last=k===cl.length-1,first=k===0;
   let pp=p*(first?1.025:1)*(last?(isQ?1.12:.94):1),rr=r*(last?.94:1.0),txt=(first?lead:'')+(first&&lead&&!/^I\b/.test(x)?x[0].toLowerCase()+x.slice(1):x);

   if(!slurDone&&!lastSlur&&!last&&w.length>=5&&Math.random()<.28){
    const j=2+Math.floor(Math.random()*(w.length-4));
    const pre=w.slice(0,j).join(' '),sg=w.slice(j,j+2).join(' '),post=w.slice(j+2).join(' ');

    out.push({t:sg,r:Math.min(rr*1.25,1.6),p:pp*.99,v:.9,pause:post?0:gap});
    if(post)out.push({t:post,r:Math.min(rr*1.06,1.5),p:pp,v,pause:gap});
    slurDone=true;
   }else out.push({t:txt,r:rr,p:pp,v,pause:gap});
  });
  lastSlur=slurDone;
 });
 return out;
};
