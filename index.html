<style>
:root{--dk:#313d9a;--bg2:#f4f5ff;--bg3:#f7f8ff;--bd2:#cbd3ff;--hero:linear-gradient(120deg,#303d91,#6576e8 65%,#9a82df);--bg:#f5f6fc;--ink:#222944;--muted:#707891;--main:#5968d9;--pale:#edf0ff;--line:#e6e9f2;--ok:#1f9d63;--okbg:#e5f7ee;--bad:#d64545;--badbg:#fdeaea;--warn:#e8a317}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI",Arial,sans-serif}
button,input{font:inherit;cursor:pointer}input{cursor:text}
.hero{background:var(--hero);color:#fff;padding:26px 16px 22px}
.wrap{max-width:1000px;margin:auto}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:800;opacity:.85}
.hero h1{margin:6px 0 4px;font-size:clamp(1.6rem,5vw,2.6rem);line-height:1.15}.hero p{margin:0;opacity:.92}
nav{position:sticky;top:0;z-index:5;background:#fffffff0;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navin{max-width:1000px;margin:auto;padding:8px 12px;display:flex;gap:8px;overflow:auto}
.nb{border:0;background:transparent;color:var(--muted);font-weight:700;padding:10px 16px;border-radius:12px;white-space:nowrap}
.nb.on{background:var(--pale);color:var(--main)}
main{max-width:1000px;margin:18px auto 50px;padding:0 14px}
.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:11px;padding:8px 13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--pale);color:var(--main);border-color:var(--bd2)}
.sub{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sb{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:8px 14px;font-weight:700}
.sb.on{background:var(--main);color:#fff;border-color:var(--main)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 26px #26336b0c}
h2{margin:0 0 4px;font-size:1.45rem}h3{margin:20px 0 8px;color:var(--dk);font-size:1.08rem}.muted{color:var(--muted)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:middle}th{background:var(--bg2);font-size:.85rem;color:var(--muted)}
td.en{font-weight:700;color:var(--dk)}td.pr{color:#5a6285;font-style:italic}
.sp{border:1px solid var(--bd2);background:var(--bg2);color:#3446a8;border-radius:10px;padding:8px 20px;font-size:1.05rem;font-weight:800;margin-right:6px}
.spOn,.btn.alt.spOn{background:#d33!important;color:#fff!important;border-color:#d33!important}
.sp:hover{background:var(--pale)}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:12px}
.ex{margin:8px 0;padding:9px 14px;background:var(--bg2);border-left:4px solid var(--main);border-radius:0 10px 10px 0}
.box{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.formula{font-weight:700;color:var(--dk)}
.btn{border:0;background:var(--main);color:#fff;font-weight:700;border-radius:12px;padding:11px 18px}
.btn.alt{background:#fff;color:var(--main);border:1px solid var(--bd2)}.btn:disabled{opacity:.45}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:13px;padding:12px 15px;margin:8px 0;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--bd2);background:var(--bg3)}
.chip.tf{min-width:96px;text-align:center;font-weight:800}
.chip.tf.on{background:#111!important;color:#fff!important;border-color:#111!important}
.chip.tf.tfT{background:#1f9d55!important;color:#fff!important;border-color:#1f9d55!important}
.chip.tf.tfF{background:#d33!important;color:#fff!important;border-color:#d33!important}
.opt.on{border-color:var(--main);background:var(--pale)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 16px}.bar i{display:block;height:100%;background:var(--main);transition:width .3s}
.qtext{font-size:1.2rem;font-weight:700;margin:6px 0 10px}
.fb{margin:10px 0;padding:10px 14px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:#14633f}.fb.bad{background:var(--badbg);color:#8e2a2a}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.gcard{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;display:flex;flex-direction:column}.gcard h3{margin:0 0 6px}.gcard .btn{align-self:flex-start;margin-top:auto}
.score{font-size:3rem;font-weight:800;color:var(--main);line-height:1.1}
.flash{perspective:900px;margin:10px auto;max-width:480px}
.fc{height:230px;border-radius:20px;border:2px solid var(--bd2);background:linear-gradient(135deg,var(--bg2),#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;cursor:pointer;user-select:none}
.fc .big{font-size:2rem;font-weight:800;color:var(--dk)}.fc .sm{color:var(--muted);margin-top:6px;font-style:italic}.fc.back{background:linear-gradient(135deg,#eefaf3,#fff);border-color:#a6dfc2}.fc.back .big{color:#14633f;font-size:1.6rem}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.mt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:700;min-height:52px}
.mt.sel{border-color:var(--main);background:var(--pale)}.mt.done{visibility:hidden}.mt.shake{border-color:var(--bad);background:var(--badbg)}
.tiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.tile{min-width:38px;height:44px;border-radius:10px;background:var(--pale);color:var(--dk);font-weight:800;font-size:1.25rem;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.ans{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:1.1rem;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.pill{display:inline-block;background:var(--pale);color:var(--main);border-radius:99px;padding:3px 12px;font-weight:700;font-size:.85rem}
.road{position:relative;height:276px;background:#4b4f5c;border-radius:16px;overflow:hidden;border:3px solid #2f3340}
.lane{position:absolute;left:0;right:0;height:92px;border-bottom:3px dashed #ffffff55;cursor:pointer}
.lane:last-child{border:0}.lane.me{background:#ffffff14}
.me-av{position:absolute;left:8px;width:96px;text-align:center;z-index:3;transition:top .15s}
.me-av .w{background:#fff;border-radius:10px;padding:2px 6px;font-weight:800;font-size:.82rem;color:#222944;border:2px solid var(--main);line-height:1.2;max-width:96px;margin:0 auto}
.bus{position:absolute;display:flex;align-items:center;gap:6px;background:#ffd43b;color:#222;border-radius:12px;padding:6px 12px;font-weight:800;font-size:.9rem;border:2px solid #b8860b;white-space:nowrap;z-index:2}
.stop{position:absolute;left:112px;top:0;bottom:0;border-left:3px dotted #ffffff66}
.pool{position:relative;height:300px;background:linear-gradient(#bfe6ff,#6cc3f5);border-radius:16px;overflow:hidden;border:3px solid #4aa6dc}
.swimmer{position:absolute;top:10px;font-size:2rem;transition:left .5s}
.fw{position:absolute;border:2px solid #fff;background:#ffffffd9;color:#222944;font-weight:800;border-radius:14px;padding:8px 14px;animation:bob 2.2s ease-in-out infinite}
.fw:hover{background:#fff;border-color:var(--main)}.fw.no{border-color:var(--bad);background:var(--badbg)}
@keyframes bob{50%{transform:translateY(-8px)}}
.sent{min-height:50px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.sw{background:var(--okbg);color:#14633f;font-weight:800;border-radius:9px;padding:4px 10px}
.sky{position:relative;height:320px;background:linear-gradient(#10163a,#3a4aa8);border-radius:16px;overflow:hidden;border:3px solid #232a66}
.fl{position:absolute;background:#fff;border-radius:11px;padding:3px 11px;text-align:center;font-weight:800;color:#222944;box-shadow:0 3px 10px #0004}
.fl small{display:block;font-weight:600;color:#5a6285;font-size:.72rem}.fl.hit{background:var(--okbg);transition:all .3s;transform:scale(1.15)}
.picture{min-height:190px;border-radius:16px;background:linear-gradient(135deg,#eef1ff,#fff);display:flex;align-items:center;justify-content:center;font-size:6rem;margin:14px 0;border:1px solid var(--bd2)}
@media(max-width:600px){
.card{padding:14px}.mg{gap:8px}.fc{height:200px}
/* Giữ hai nút giọng US/GB gọn bên trong khung trên điện thoại */
.card table{display:block;width:100%;max-width:100%;overflow-x:auto;}
.card table td:last-child{min-width:82px;white-space:normal;}
.card table .sp{display:block;width:100%;max-width:100%;margin:3px 0;padding:5px 4px;white-space:nowrap;}
.card .row{max-width:100%;}
.card .row .btn{max-width:100%;white-space:normal;}
}
body.adv{--main:#d32f2f;--pale:#fdecec;--dk:#a31515;--bg2:#fff4f4;--bg3:#fff8f8;--bd2:#f3b9b9;--bg:#fdf5f5;--hero:linear-gradient(120deg,#7f0f0f,#d32f2f 65%,#ff6b57)}
.foot{max-width:1000px;margin:0 auto 30px;padding:0 14px;display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
.fp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 8px 26px #26336b0c}
.ft{font-weight:800;color:var(--dk);display:flex;align-items:center;justify-content:space-between;gap:10px}.fv{font-size:1.05rem}.fv b{font-size:1.4rem;color:var(--main)}
.fm{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
#mname{text-align:center;flex:1;font-size:1.05rem}#mname b{color:var(--main)}
.arr{border:1px solid var(--bd2);background:var(--bg2);color:var(--main);font-weight:800;border-radius:10px;padding:8px 12px;min-width:104px}
.arr:hover{background:var(--pale)}
@media(max-width:600px){.foot{grid-template-columns:1fr}}

/* Chuyển chế độ: chuyển sắc nhẹ, không phô trương */
body, .card, .hero, .nb, .chip, .modebox { transition: background-color .38s ease, color .3s ease, border-color .38s ease, box-shadow .38s ease; }
#app.mode-enter { animation: modeEnter .42s cubic-bezier(.2,.7,.25,1) both; }
@keyframes modeEnter { from { opacity:.72; transform:translateY(7px); filter:blur(1.5px); } to { opacity:1; transform:translateY(0); filter:blur(0); } }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
#editEntry{display:inline-flex;align-items:center;justify-content:center;width:36px;height:34px;margin-left:auto;font-size:25px;line-height:1;cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--pale);color:var(--dk);flex:0 0 auto}
</style>

g:`<h3>Nhóm 1: I / YOU / WE / THEY</h3>
<div class="box"><b>Khẳng định:</b> động từ nguyên mẫu, không thêm s/es.</div><div class="ex">They play football. — Họ chơi bóng đá.</div>
<div class="box"><b>Phủ định:</b> <span class="formula">S + don't + V</span></div><div class="ex">You don't like English. — Bạn không thích tiếng Anh.</div>
<div class="box"><b>Nghi vấn:</b> <span class="formula">Do + S + V?</span> → Yes, they do. / No, they don't.</div><div class="ex">Do you like English? — Bạn có thích tiếng Anh không?</div>
<h3>Nhóm 2: HE / SHE / IT</h3>
<div class="box"><b>Khẳng định:</b> thêm s/es vào động từ.</div><div class="ex">She plays football. — Cô ấy chơi bóng đá.</div>
<div class="box"><b>Phủ định:</b> <span class="formula">S + doesn't + V</span></div><div class="ex">He doesn't like English. — Anh ấy không thích tiếng Anh.</div>
<div class="box"><b>Nghi vấn:</b> <span class="formula">Does + S + V?</span> → Yes, she does. / No, he doesn't.</div><div class="ex">Does she play football? — Cô ấy có chơi bóng đá không?</div>
<h3>Lưu ý: động từ to be</h3>
<div class="box">I <b>am</b> smart. · You / We / They <b>are</b> smart. · He / She / It <b>is</b> smart.<br>Phủ định: am not / isn't / aren't. Câu hỏi: Am / Is / Are + chủ ngữ …?</div>`},

g:`<h3>Nhóm 1: Possessive case (sở hữu cách)</h3>
<div class="box"><b>Danh từ số ít:</b> thêm <span class="formula">'s</span></div><div class="ex">Lan's bedroom — Phòng ngủ của Lan. · My mother's room — Phòng của mẹ tôi.</div>
<div class="box"><b>Danh từ số nhiều có s:</b> thêm <span class="formula">'</span></div><div class="ex">My parents' room — Phòng của bố mẹ tôi.</div>
<h3>Nhóm 2: Prepositions of place (giới từ chỉ vị trí)</h3>
<div class="box">in (bên trong) · on (bên trên) · under (bên dưới) · behind (phía sau) · in front of (phía trước) · next to (bên cạnh) · between (ở giữa)</div>
<div class="box"><span class="formula">S + am/is/are + giới từ + địa điểm</span></div>
<div class="ex">The cat is under the table. — Con mèo ở dưới bàn.</div><div class="ex">The bed is next to the window. — Giường ở cạnh cửa sổ.</div>
<h3>Phát âm âm cuối -s</h3>

g:`<h3>Present continuous (hiện tại tiếp diễn)</h3>
<div class="box"><b>Cách dùng:</b> hành động đang xảy ra tại thời điểm nói.</div>
<div class="box"><b>Khẳng định:</b> <span class="formula">S + am/is/are + V-ing</span></div><div class="ex">She is reading a book. — Cô ấy đang đọc sách.</div>
<div class="box"><b>Phủ định:</b> <span class="formula">S + am/is/are + not + V-ing</span></div><div class="ex">They aren't swimming. — Họ không đang bơi.</div>
<div class="box"><b>Nghi vấn:</b> <span class="formula">Am/Is/Are + S + V-ing?</span> → Yes, S + am/is/are. / No, S + am/is/are + not.</div><div class="ex">Is she reading a book? — Cô ấy đang đọc sách phải không?</div>
<div class="box"><b>Dấu hiệu:</b> now, right now, at the moment, Look!, Listen!</div>
<h3>Phát âm /b/ và /p/</h3>
<div class="box"><b>/b/</b>: nhẹ, có rung cổ họng (big, book) · <b>/p/</b>: bật hơi, không rung (pen, play)</div>`},

g:`<h3>Comparative adjectives (so sánh hơn)</h3>
<div class="box"><b>Tính từ ngắn:</b> <span class="formula">S1 + be + adj-er + than + S2</span></div><div class="ex">Nam is taller than Minh. — Nam cao hơn Minh.</div>
<div class="box"><b>Tính từ dài:</b> <span class="formula">S1 + be + more + adj + than + S2</span></div><div class="ex">This city is more beautiful than that city. — Thành phố này đẹp hơn thành phố kia.</div>
<div class="box"><b>Trường hợp đặc biệt:</b><table><tr><th>Tính từ</th><th>So sánh hơn</th></tr><tr><td>good</td><td>better</td></tr><tr><td>bad</td><td>worse</td></tr><tr><td>far</td><td>farther / further</td></tr><tr><td>many / much</td><td>more</td></tr><tr><td>little</td><td>less</td></tr></table></div>
<div class="box"><b>Quy tắc thêm -er:</b> tall → taller · nice → nicer · happy → happier · big → bigger (phụ âm–nguyên âm–phụ âm: gấp đôi phụ âm cuối)</div>
<h3>Phát âm /ɪ/ và /iː/</h3>
<div class="box"><b>/ɪ/</b>: i ngắn (big, city, busy) · <b>/iː/</b>: i dài (beach, street, see)</div><h3>Từ chỉ đường: hỏi đường</h3>
<div class="ex">Excuse me, where is the railway station? — Xin lỗi, ga tàu hỏa ở đâu ạ?</div>
<div class="ex">How can I get to the art gallery? — Tôi đến phòng trưng bày nghệ thuật bằng cách nào?</div>
<h3>Chỉ đường</h3>
<div class="box"><span class="formula">Go straight / Turn left / Turn right + (at the …)</span></div>
<div class="ex">Go straight and turn left at the crossroads. — Đi thẳng rồi rẽ trái ở ngã tư.</div>
<div class="ex">Go along this road. The cathedral is on your right. — Đi dọc con đường này. Nhà thờ lớn ở bên phải bạn.</div>
<div class="ex">The school is opposite the park. — Trường học đối diện công viên.</div>
<h3>Lưu ý</h3>
<div class="box">Các giới từ vị trí đã học ở Unit 2 (next to, between, in front of, behind) cũng dùng để chỉ đường.</div>`},

<div class="box"><b>Some</b> (một vài, một ít): câu khẳng định.</div><div class="ex">I have some books. — Tôi có một vài quyển sách.</div>

g:`<h3>Past simple (quá khứ đơn)</h3>
<div class="box"><b>Cách dùng:</b> hành động đã xảy ra và kết thúc trong quá khứ. Dấu hiệu: yesterday, last week, in 2019, two days ago, when I was young.</div>
<div class="box"><b>Khẳng định:</b> <span class="formula">S + V-ed (động từ có quy tắc) / V2 (bất quy tắc)</span></div><div class="ex">She felt nervous. · They arrived late. — Cô ấy thấy lo lắng. · Họ đến muộn.</div>
<div class="box"><b>Phủ định:</b> <span class="formula">S + didn't + V (nguyên mẫu)</span></div><div class="ex">He didn't win the game. — Anh ấy không thắng trận đấu.</div>
<div class="box"><b>Nghi vấn:</b> <span class="formula">Did + S + V?</span> → Yes, I did. / No, I didn't.</div><div class="ex">Did you enjoy the film? — Bạn có thích bộ phim không?</div>
<div class="box"><b>Động từ to be:</b> was (I/he/she/it), were (you/we/they). Phủ định: wasn't / weren't. Câu hỏi: Was he …? Were you …?</div>
<h3>Quy tắc thêm -ed</h3>
<div class="box">play → played · like → liked · study → studied · stop → stopped (gấp đôi phụ âm cuối)</div>
<h3>Một số động từ bất quy tắc thường gặp</h3>
<div class="box">go → went · have → had · feel → felt · buy → bought · see → saw · take → took · make → made · say → said</div>
<h3>Đuôi tính từ -ed / -ing</h3>
<div class="box">-ed: cảm giác của người (I'm bored.) · -ing: tính chất của sự vật/sự việc (The film is boring.)</div>`},

g:`<h3>Past continuous (quá khứ tiếp diễn)</h3>
<div class="box"><b>Cách dùng:</b> hành động đang diễn ra tại một thời điểm trong quá khứ, hoặc đang diễn ra thì có hành động khác xen vào.</div>
<div class="box"><b>Khẳng định:</b> <span class="formula">S + was/were + V-ing</span></div><div class="ex">I was climbing a hill at 8 o'clock. — Lúc 8 giờ tôi đang leo đồi.</div>
<div class="box"><b>Phủ định:</b> <span class="formula">S + wasn't/weren't + V-ing</span></div><div class="ex">They weren't sailing. — Họ đã không đang đi thuyền.</div>
<div class="box"><b>Nghi vấn:</b> <span class="formula">Was/Were + S + V-ing?</span></div><div class="ex">Were you diving at that time? — Lúc đó bạn đang lặn phải không?</div>
<h3>Quá khứ đơn và quá khứ tiếp diễn</h3>
<div class="box"><span class="formula">S + was/were + V-ing + when + S + V2</span> (hành động dài bị hành động ngắn xen vào)</div><div class="ex">We were walking in the jungle when it started to rain. — Chúng tôi đang đi trong rừng thì trời bắt đầu mưa.</div>
<div class="box"><span class="formula">While + S + was/were + V-ing, S + V2</span></div><div class="ex">While she was sailing, she saw a whale. — Khi đang đi thuyền, cô ấy nhìn thấy một con cá voi.</div>
<div class="box"><b>Lưu ý:</b> when + quá khứ đơn (hành động ngắn); while + quá khứ tiếp diễn (hành động dài).</div>`},

g:`<h3>Nhóm 1: Lượng từ (some, any, much, many, a lot of, a little, a few)</h3>
<div class="box"><b>Danh từ đếm được (số nhiều):</b> many, a few, few · <b>Không đếm được:</b> much, a little, little · <b>Cả hai:</b> some, any, a lot of / lots of</div>
<div class="ex">There are a lot of channels. · I watched a few episodes. · We have a little time.</div>
<div class="box"><b>some</b>: câu khẳng định · <b>any</b>: câu phủ định và câu hỏi · <b>much / many</b>: thường dùng trong câu phủ định và câu hỏi</div>
<div class="ex">I don't have much time. · Are there many scenes in the film? · I haven't got any tickets.</div>
<div class="box"><b>a few / a little</b> = một vài, một ít (vừa đủ) · <b>few / little</b> = rất ít, hầu như không có</div>
<h3>Nhóm 2: must / mustn't / needn't</h3>
<div class="box"><b>must</b> + V: bắt buộc · <b>mustn't</b> + V: cấm, không được phép · <b>needn't</b> + V: không cần thiết (không bắt buộc)</div>
<div class="ex">You must switch off your phone. — Bạn phải tắt điện thoại.</div><div class="ex">You mustn't talk during the film. — Bạn không được nói chuyện khi xem phim.</div><div class="ex">You needn't buy a ticket. It's free. — Bạn không cần mua vé. Miễn phí mà.</div>
<div class="box"><b>Lưu ý:</b> mustn't (cấm) khác với needn't (không cần).</div>`},

g:`<h3>So sánh bằng: (not) as … as</h3>
<div class="box"><span class="formula">S + be + as + adj + as + …</span> (bằng nhau) · <span class="formula">S + be + not as + adj + as + …</span> (không bằng)</div>
<div class="ex">Solar power is as clean as wind power. — Năng lượng mặt trời sạch như năng lượng gió.</div><div class="ex">Recycling isn't as difficult as people think. — Tái chế không khó như người ta nghĩ.</div>
<h3>too + adj (quá … đến mức không thể)</h3>
<div class="box"><span class="formula">too + adj (+ to V)</span> — mang nghĩa tiêu cực</div>
<div class="ex">It's too hot to go outside. — Trời quá nóng để ra ngoài.</div>
<h3>adj + enough (đủ … để)</h3>
<div class="box"><span class="formula">adj + enough (+ to V)</span> · <span class="formula">enough + danh từ</span></div>
<div class="ex">The bag is big enough for my books. — Chiếc túi đủ lớn để đựng sách của tôi.</div><div class="ex">We don't have enough energy. — Chúng ta không có đủ năng lượng.</div>
<div class="box"><b>Lưu ý:</b> enough đứng <b>sau</b> tính từ nhưng đứng <b>trước</b> danh từ.</div>`},

g:`<h3>Nhóm 1: will và be going to</h3>
<div class="box"><b>will + V:</b> quyết định tức thời, dự đoán dựa trên ý kiến (I think, probably), lời hứa.</div>
<div class="ex">I think she will be a famous singer. — Tôi nghĩ cô ấy sẽ là ca sĩ nổi tiếng.</div><div class="ex">I'll help you. — Mình sẽ giúp bạn.</div>
<div class="box"><b>be going to + V:</b> kế hoạch, dự định đã có từ trước; dự đoán dựa trên bằng chứng ở hiện tại.</div>
<div class="ex">I'm going to study law at university. — Tôi định học luật ở đại học.</div><div class="ex">Look at those clouds! It's going to rain. — Nhìn mây kìa! Trời sắp mưa.</div>
<h3>Nhóm 2: First conditional (câu điều kiện loại 1)</h3>
<div class="box">Diễn tả điều kiện có thể xảy ra ở hiện tại hoặc tương lai.</div>
<div class="box"><span class="formula">If + S + V (hiện tại đơn), S + will + V</span></div>
<div class="ex">If you work hard, you will succeed. — Nếu bạn chăm chỉ, bạn sẽ thành công.</div><div class="ex">If it rains, we won't go out. — Nếu trời mưa, chúng tôi sẽ không ra ngoài.</div>
<div class="box"><b>Lưu ý:</b> sau if dùng hiện tại đơn, <b>không</b> dùng will.</div>`},

g:`<h3>Nhóm 1: Present perfect (hiện tại hoàn thành)</h3>
<div class="box"><b>Cách dùng:</b> trải nghiệm trong đời (chưa nói thời gian), hành động vừa xảy ra, hành động bắt đầu trong quá khứ và còn kéo dài đến nay.</div>
<div class="box"><b>Khẳng định:</b> <span class="formula">S + have/has + V3 (quá khứ phân từ)</span></div><div class="ex">I have visited Hue. — Tôi đã đến Huế.</div>
<div class="box"><b>Phủ định:</b> <span class="formula">S + haven't/hasn't + V3</span></div><div class="ex">She hasn't booked a hotel yet. — Cô ấy chưa đặt khách sạn.</div>
<div class="box"><b>Nghi vấn:</b> <span class="formula">Have/Has + S + V3?</span></div><div class="ex">Have you ever travelled abroad? — Bạn đã từng đi nước ngoài chưa?</div>
<div class="box"><b>Dấu hiệu:</b> ever, never, already, yet, just, so far · for + khoảng thời gian · since + mốc thời gian</div>
<div class="ex">We have lived here for ten years. · He has worked here since 2020.</div>
<h3>Nhóm 2: Present perfect và past simple</h3>
<div class="box"><b>Past simple:</b> có thời gian xác định trong quá khứ (yesterday, last year, in 2019, ago).</div><div class="ex">I went to Da Nang last summer.</div>
<div class="box"><b>Present perfect:</b> không nói rõ thời gian, hoặc còn liên quan đến hiện tại.</div><div class="ex">I have been to Da Nang.</div>
<div class="box"><b>Lưu ý:</b> have been to = đã từng đến (và đã về) · have gone to = đã đi (chưa về).</div>`},

g:`<h3>Nhóm 1: Second conditional (câu điều kiện loại 2)</h3>
<div class="box">Diễn tả điều kiện <b>không có thật</b> ở hiện tại hoặc ít có khả năng xảy ra ở tương lai.</div>
<div class="box"><span class="formula">If + S + V2 (quá khứ đơn), S + would + V</span></div>
<div class="ex">If I had a million dollars, I would buy a house. — Nếu tôi có một triệu đô, tôi sẽ mua nhà.</div><div class="ex">What would you do if you won the lottery? — Bạn sẽ làm gì nếu trúng xổ số?</div>
<div class="box"><b>Lưu ý:</b> với to be, thường dùng <b>were</b> cho mọi ngôi: If I were rich, … · If I were you, I would save money.</div>
<h3>Nhóm 2: Past perfect (quá khứ hoàn thành)</h3>
<div class="box"><b>Cách dùng:</b> hành động xảy ra <b>trước</b> một hành động hoặc thời điểm khác trong quá khứ.</div>
<div class="box"><span class="formula">S + had + V3</span> · phủ định: hadn't + V3 · nghi vấn: Had + S + V3?</div>
<div class="ex">When we arrived, the film had already started. — Khi chúng tôi đến, bộ phim đã bắt đầu rồi.</div><div class="ex">He was sad because he had lost his wallet. — Anh ấy buồn vì đã làm mất ví.</div>
<div class="box"><b>Dấu hiệu:</b> already, before, after, by the time, when.</div>`},

g:`<h3>Reported speech (câu tường thuật)</h3>
<div class="box">Dùng để thuật lại lời người khác. Thường <b>lùi một thì</b> khi động từ tường thuật ở quá khứ (said, told, asked).</div>
<h3>1. Câu kể</h3>
<div class="box"><span class="formula">S + said (that) + S + V (lùi thì)</span></div>
<div class="ex">"I am tired," she said. → She said (that) she was tired. — Cô ấy nói cô ấy mệt.</div><div class="ex">"We live in Hue," they said. → They said they lived in Hue.</div>
<div class="box"><table><tr><th>Lời nói trực tiếp</th><th>Lời tường thuật</th></tr><tr><td>present simple</td><td>past simple</td></tr><tr><td>present continuous</td><td>past continuous</td></tr><tr><td>past simple</td><td>past perfect</td></tr><tr><td>present perfect</td><td>past perfect</td></tr><tr><td>will</td><td>would</td></tr><tr><td>can</td><td>could</td></tr></table></div>
<div class="box"><b>Đổi trạng từ:</b> now → then · today → that day · tomorrow → the next day · yesterday → the day before · here → there · this → that</div>
<h3>2. Câu hỏi</h3>
<div class="box"><span class="formula">asked + (O) + if/whether + S + V</span> (Yes/No) · <span class="formula">asked + (O) + từ hỏi + S + V</span> (không đảo ngữ)</div>
<div class="ex">"Where do you live?" → She asked me where I lived.</div>
<h3>3. Câu mệnh lệnh / yêu cầu</h3>
<div class="box"><span class="formula">told/asked + O + (not) + to + V</span></div>
<div class="ex">"Don't touch it." → He told me not to touch it. — Anh ấy bảo tôi đừng chạm vào.</div>`},

g:`<h3>Passive voice (câu bị động)</h3>
<div class="box"><b>Cách dùng:</b> nhấn mạnh hành động hoặc đối tượng chịu tác động, khi không biết hoặc không cần nói rõ người thực hiện.</div>
<div class="box"><b>Công thức chung:</b> <span class="formula">S + be + V3 (+ by + tác nhân)</span></div>
<table><tr><th>Thì</th><th>Công thức</th><th>Ví dụ</th></tr>
<tr><td>Present simple</td><td>am/is/are + V3</td><td>English is spoken all over the world.</td></tr>
<tr><td>Past simple</td><td>was/were + V3</td><td>The telephone was invented by Bell.</td></tr>
<tr><td>Present perfect</td><td>have/has been + V3</td><td>The experiment has been finished.</td></tr>
<tr><td>Future (will)</td><td>will be + V3</td><td>A new robot will be built next year.</td></tr></table>
<div class="box"><b>Cách đổi:</b> tân ngữ của câu chủ động → chủ ngữ của câu bị động; động từ → be + V3; chủ ngữ cũ → by + tân ngữ (có thể bỏ).</div>
<div class="ex">They make phones from glass and metal. → Phones are made from glass and metal.</div>
<div class="ex">Marie Curie discovered radium. → Radium was discovered by Marie Curie.</div>
<h3>Vật liệu: be made of / be made from</h3>
<div class="box">made of: vật liệu còn nhận ra được (a table made of wood) · made from: vật liệu bị biến đổi (paper is made from wood).</div>`}
];

function vq(w,pool){
  const dir=Math.random()<.5,key=dir?'vi':'en';
  const ds=sh(pool.filter(x=>x[key]!==w[key]&&x.en!==w.en)).reduce((a,x)=>(a.length<3&&!a.some(y=>y[key]===x[key])?a.concat(x):a),[]);
  const opts=sh([{t:w[key],ok:1},...ds.map(x=>({t:x[key],ok:0}))]);
  return{t:'mc',q:dir?`“${w.en}” nghĩa là gì?`:`“${w.vi}” trong tiếng Anh là?`,speak:dir?w.en:'',opts,exp:`${w.en} = ${w.vi}`};
}
function gq(g){return{t:'mc',q:g[1],speak:'',opts:sh(g[2].map((t,i)=>({t,ok:i===0?1:0}))),exp:g[3]}}

function wrs(s){return{t:'type',q:`✍️ Viết câu tiếng Anh: “${s[2]}”`,hint:`Gợi ý: ${s[1].split(' ').length} từ, bắt đầu bằng “${s[1].split(' ')[0]}”`,ans:s[1],exp:`${s[1]}.`,say:s[1]}}
function sy(w){return{t:'say',q:'🗣️ Đọc to từ sau',word:w,exp:`${w.en}${w.p?' ['+w.p+']':''} = ${w.vi}`}}

function buildTest(id,k,rv){
  const pool=words(id),sp=id?SENT.filter(x=>x[0]===id):SENT,gl=G.filter(g=>g[0]===id);

  if(k==='listen')return sh([...W(rv?10:7).map(w=>lw(w,pool)),...S(rv?5:3).map(lsn)]);
  if(k==='write')return sh([...W(rv?10:7).map(wr),...S(rv?4:3).map(wrs)]);
  if(k==='speak')return[...W(rv?10:8).map(sy),...S(rv?3:2).map(sys)];
  if(id)return sh([...W(gl.length?5:10).map(w=>vq(w,pool)),...sh(gl).slice(0,5).map(gq)]);

{title:'Travelling by bicycle',text:`In many towns, cycling is becoming a popular way to travel. A bicycle is cheaper than a car and does not produce exhaust fumes. It can also be a convenient choice for short journeys, especially when roads are busy. However, cycling in a town requires care and good planning.\n\nSome local councils have built special bicycle lanes. These lanes help cyclists travel more safely and make it easier for drivers to see them. Schools sometimes organise bicycle days to teach students about road signs, helmets and safe behaviour at crossings. Parents are encouraged to check that a bicycle has working lights and brakes before a journey.\n\nCycling is not the best choice for every trip. Heavy rain, long distances and dangerous roads can make it difficult. People should choose a suitable route and never use a phone while riding. If towns provide safe paths and places to park bicycles, more people may decide to leave their cars at home.`,tf:[['Cycling can be useful for short journeys.','True'],['Bicycle lanes make it harder for drivers to see cyclists.','False'],['People should use a phone while riding.','False']],mc:['What should people check before cycling?',['Lights and brakes','The car engine','A train ticket','The weather app only'],0]},

{title:'How cities can become more sustainable',text:`Cities are growing rapidly, and this growth creates both opportunities and challenges. More people can find jobs, use public services and enjoy cultural activities. At the same time, crowded roads, air pollution and the increasing amount of waste can affect the quality of life. For this reason, many city planners are looking for ways to make urban areas more sustainable.\n\nOne important approach is to improve public transport. Reliable buses, trains and safe cycling routes can reduce the number of private cars on the road. This does not mean that everyone must stop driving; rather, residents should have practical alternatives for everyday journeys. When public transport is frequent, affordable and well connected, people are more likely to use it.\n\nGreen spaces are another essential part of a healthy city. Parks and trees provide places to relax, support wildlife and help cool streets during hot weather. However, creating a park is not enough. Local communities need to help care for these spaces, and planners must make sure that people in different neighbourhoods can reach them easily.\n\nWaste management also requires careful attention. Separating rubbish, repairing useful objects and choosing products with less packaging can reduce the amount sent to landfill. Schools and community groups can explain how recycling works, but clear collection systems are needed too. If the process is confusing, even people who want to help may find it difficult to take part.\n\nTechnology can support these changes by measuring traffic, energy use and air quality. Nevertheless, technology alone cannot solve every problem. Successful plans depend on good public services, long-term investment and the participation of residents. A sustainable city is not simply a place with modern buildings; it is a place where people can live safely and comfortably while using resources responsibly.`,tf:[['Sustainable city planning focuses only on building modern offices.','False'],['Frequent and affordable public transport may encourage people to use it.','True'],['The passage says technology can solve every urban problem by itself.','False'],['Green spaces can help cool streets in hot weather.','True']],mc:['According to the passage, why can recycling systems fail?',['The process may be confusing','There are too many parks','People cannot use public transport','Technology measures air quality'],0]},
{title:'The science of sleep and learning',text:`Sleep is often treated as time when the brain stops working, but research has shown that it remains active. During sleep, the brain processes information gathered during the day. This activity is connected with memory, attention and the ability to learn new skills. Although the exact processes are complex, regular sleep is widely considered an important part of a healthy routine.\n\nStudents sometimes stay awake late because they want to finish homework or prepare for a test. This may seem helpful in the short term, but a tired student can find it harder to concentrate and remember information. Studying for a shorter period on several days is often more manageable than trying to learn everything in one night. Breaks can also help learners return to a task with better focus.\n\nThe environment matters as well. A quiet, comfortable room and a regular bedtime can make it easier to rest. Bright screens immediately before bedtime may keep some people alert, so it can be useful to choose a calmer activity instead. Caffeine late in the day can also affect sleep for some individuals, although sensitivity differs from person to person.\n\nGood sleep habits do not guarantee perfect results at school. Learning also depends on teaching, practice, motivation and many other factors. However, students who protect their rest may find it easier to pay attention in lessons and manage their work. Families and schools can support this by encouraging balanced schedules rather than praising constant late-night study.\n\nThe most useful message is that learning and rest should support each other. A realistic plan includes time for lessons, homework, hobbies, movement and sleep. When students understand this connection, they can make choices that support both their education and their general well-being.`,tf:[['The brain becomes completely inactive during sleep.','False'],['The passage suggests studying over several days can be manageable.', {title:'Protecting wildlife corridors',text:`As towns and roads expand, natural habitats can become divided into smaller areas. Animals that once moved freely between forests, wetlands and grasslands may find their routes blocked by buildings or busy roads. This separation can make it harder for populations to find food, reach water and reproduce. Conservation scientists therefore study ways to reconnect important habitats.\n\nA wildlife corridor is an area of natural or restored land that links separate habitats. Some corridors follow rivers or tree lines, while others are designed as safe crossings over or under roads. Their purpose is not to keep animals in one place. Instead, they allow movement between areas that animals need at different times of the year.\n\nDesigning a corridor requires information about local species and their behaviour. A crossing that works for small mammals may not be suitable for larger animals. Researchers may use camera traps, tracks and observations to understand which routes are already being used. They also consider nearby farms, roads and communities, because a plan that ignores local needs may be difficult to maintain.\n\nCorridors can bring benefits, but they are not a complete solution. Habitats must still be protected from pollution, uncontrolled development and other pressures. In some places, a narrow strip of land may be too small or too exposed to provide safe passage. Long-term monitoring helps conservation teams discover whether animals are using the corridor and whether changes are needed.\n\nSuccessful projects often involve several groups. Scientists provide evidence, local authorities make planning decisions, and residents can share knowledge about the area. When these groups cooperate, it becomes more possible to balance human development with the needs of wildlife. Protecting nature is not only about saving individual species; it is also about maintaining the connections that allow ecosystems to function.`,tf:[['Wi  if(!SR){note.textContent='Trình duyệt chưa hỗ trợ nhận giọng nói. Hãy đọc to rồi tự đánh giá.';return}
 let got=false;const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;note.textContent='🎤 Đang nghe…';
 r.onresult=e=>{got=true;const alts=Array.from(e.results[0]).map(a=>a.transcript),best=Math.max(...alts.map(a=>simScore(a,l.en)));if(best>=.8){l.ok=1;note.textContent='✅ Đọc tốt!'}else note.textContent='Nghe được: “'+alts[0]+'”. Thử lại nhé.'};
 r.onerror=e=>{got=true;note.textContent='Chưa dùng được micro ('+e.error+'). Hãy đọc to rồi tự đánh giá.'};
 r.onend=()=>{if(!got)note.textContent='Không nghe thấy gì. Thử lại nhé.'};
 try{r.start()}catch(e){note.textContent='Không bật được micro.'}
}
function submitSpeak(v){
 const q=T.list[T.i];if(q.sub)return;q.sub=true;const ok=v||(q.lines&&q.lines.every(l=>l.ok));if(ok)T.score++;else T.wrong.push({q:'🗣️ '+(q.lines?'Đọc to: '+q.lines.map(l=>l.en).join(' / '):'Phần nói: '+q.parts.map(l=>l.title).join(' / ')),a:'Luyện đọc lại',e:''});
 $('#pfb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'✅ Tốt lắm!':'🔁 Hãy luyện thêm và thử lại.'}</div>${nextBtn()}`;
}
viewResult=function(){
 const n=totalOf(T.list),p=Math.round(T.score/n*100);
 const msg=p>=90?'Xuất sắc! 🌟':p>=70?'Khá tốt, tiếp tục phát huy! 👍':p>=50?'Đạt, cần ôn thêm một chút.':'Cần ôn lại nhé.';
 const back=T.topic?'Chọn chủ đề khác':'Chọn Unit khác';
 app.innerHTML=`<div class="card" style="text-align:center"><div class="muted">Kết quả ${T.rv?'ôn tập':'kiểm tra'}${T.aggregate?' tổng hợp':''}</div><div class="score">${T.score}/${n}</div><div><b>${p}%</b> — ${msg}</div>
 <div class="row">${T.rv?`<button class="btn" onclick="startReview(${T.id},'${T.k}')">Ôn lại</button><button class="btn alt" onclick="viewReview()">Chọn kỹ năng khác</button>`:`<button class="btn" onclick="startTest(${T.id})">Làm lại</button><button class="btn alt" onclick="viewTestMenu()">${back}</button>`}</div></div>
 ${T.wrong.length?`<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Các câu cần xem lại (${T.wrong.length})</h3>${T.wrong.map(w=>`<div class="box"><b>${w.q}</b><br>Đáp án: <b style="color:var(--ok)">${w.a}</b>${w.e?' — '+w.e:''}</div>`).join('')}</div>`:''}`;
};

/* Ghép từ */
let M;
function mgStart(){
  const pick=[];for(const w of sh(words(gu))){if(pick.length<6&&!pick.some(x=>x.vi===w.vi))pick.push(w)}
  M={p:pick,L:sh(pick.map((_,i)=>i)),R:sh(pick.map((_,i)=>i)),l:null,r:null,done:new Set(),miss:0,t0:Date.now(),bad:null};mgView();
}
function mgView(){
  if(M.done.size===M.p.length){const s=Math.round((Date.now()-M.t0)/1000);
    app.innerHTML=`<div class="card" style="text-align:center"><div class="score">🎉</div><h2>Hoàn thành!</h2><p>Thời gian: <b>${s} giây</b> · Ghép sai: <b>${M.miss}</b> lần</p><div class="row"><button class="btn" onclick="mgStart()">Chơi lại</button>${back}</div></div>`;return}
  const t=(side,i,txt)=>`<button class="mt ${M.done.has(i)?'done':''} ${(side==='L'?M.l:M.r)===i?'sel':''} ${M.bad&&M.bad[side]===i?'shake':''}" onclick="mgClick('${side}',${i})">${txt}</button>`;
  app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><span class="pill">${gu?'Unit '+gu:'Tất cả'}</span><span class="muted">Đã ghép ${M.done.size}/${M.p.length} · Sai ${M.miss}</span></div><p class="muted">Chọn một từ tiếng Anh rồi chọn nghĩa tương ứng.</p>
  <div class="mg"><div>${M.L.map(i=>t('L',i,M.p[i].en)).join('<div style="height:10px"></div>')}</div><div>${M.R.map(i=>t('R',i,M.p[i].vi)).join('<div style="height:10px"></div>')}</div></div><div class="row">${back}</div></div>`;
}
function mgClick(side,i){
  if(M.done.has(i)||M.bad)return;
  if(side==='L'){M.l=i;speak(M.p[i].en)}else M.r=i;
  if(M.l!==null&&M.r!==null){
    if(M.l===M.r){M.done.add(M.l);M.l=M.r=null}
    else{M.miss++;M.bad={L:M.l,R:M.r};M.l=M.r=null;mgView();setTimeout(()=>{M.bad=null;mgView()},600);return}
  }
  mgView();
}

/* Sắp xếp chữ */
let S;
function scramble(w){const a=w.toLowerCase().replace(/[^a-z]/g,'').split('');let s;let n=0;do{s=sh(a).join('');n++}while(s===a.join('')&&a.length>2&&n<20);return s}
function scStart(){S={l:sh(words(gu)).slice(0,10),i:0,score:0,hint:0,res:null};scView()}
function scView(){
  if(S.i>=S.l.length){app.innerHTML=`<div class="card" style="text-align:center"><div class="muted">Kết quả</div><div class="score">${S.score}/${S.l.length}</div><div class="row"><button class="btn" onclick="scStart()">Chơi lại</button>${back}</div></div>`;return}
  const w=S.l[S.i],sc=S.sc||(S.sc=scramble(w.en));
  const letters=w.en.replace(/[^a-z]/gi,'');
  app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><span class="pill">${gu?'Unit '+gu:'Tất cả'}</span><span class="muted">Từ ${S.i+1}/${S.l.length} · Điểm ${S.score}</span></div>
  <div class="bar"><i style="width:${S.i/S.l.length*100}%"></i></div>
  <div class="qtext" style="text-align:center">${w.vi}</div><div class="muted" style="text-align:center">${letters.length} chữ cái${w.en.includes(' ')||w.en.includes('-')?' (bỏ qua khoảng trắng / dấu gạch)':''}${S.hint?` · Gợi ý: <b>${w.en[0]}</b>…`:''}</div>
  <div class="tiles">${sc.split('').map(c=>`<div class="tile">${c}</div>`).join('')}</div>
  <input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án…" onkeydown="if(event.key==='Enter')scCheck()" ${S.res?'disabled':''}>
  <div id="fb">${S.res?`<div class="fb ${S.res.ok?'ok':'bad'}">${S.res.ok?'✅ Chính xác!':'❌ Đáp án: <b>'+w.en+'</b>'} ${w.p?'· '+w.p:''}</div>`:''}</div>
  <div class="row">${S.res?`<button class="btn" onclick="scNext()">Tiếp →</button>`:`<button class="btn" onclick="scCheck()">Kiểm tra</button><button class="btn alt" onclick="S.hint=1;scView()">💡 Gợi ý</button><button class="btn alt" onclick="scGive()">Bỏ qua</button>`}<button class="btn alt" onclick="speak('${esc(w.en)}')" ${S.res?'':'style="display:none"'}>🔊</button></div><div class="row">${back}</div></div>`;
  if(!S.res){const e=$('#ans');if(e)e.focus()}
}
function scCheck(){
  const w=S.l[S.i],v=$('#ans').value.toLowerCase().replace(/[^a-z]/g,'');if(!v)return;
  const ok=v===w.en.toLowerCase().replace(/[^a-z]/g,'');if(ok)S.score+=S.hint?0.5:1;S.res={ok};scView();if(ok)speak(w.en);
}
function scGive(){S.res={ok:false};scView()}
function scNext(){S.i++;S.sc=null;S.hint=0;S.res=null;scView()}

ravels on railway tracks.', plane:'A vehicle that flies in the sky.', hospital:'A place where doctors and nurses help sick people.', park:'A public green place where people can walk and relax.', money:'You use this to buy things.', doctor:'A person whose job is to help sick people.', football:'A sport played by two teams who kick a ball.', basketball:'A sport where players throw a ball through a high hoop.', camera:'A device used to take photos.'

/* Đoán ngữ pháp: nghe câu mẫu và chọn tên cấu trúc */
const GRAMMAR_ROUNDS=[
{type:'Present simple',vi:'Thì hiện tại đơn',sentence:'She goes to school every day.',why:'Diễn tả thói quen; goes có -es vì chủ ngữ là She.'},
{type:'Present simple',vi:'Thì hiện tại đơn',sentence:'They do not play tennis on Sundays.',why:'Câu phủ định hiện tại đơn với They + do not + động từ nguyên mẫu.'},
{type:'Present continuous',vi:'Thì hiện tại tiếp diễn',sentence:'Look! The children are playing in the garden.',why:'Hành động đang diễn ra; are + V-ing.'},
{type:'Present continuous',vi:'Thì hiện tại tiếp diễn',sentence:'I am doing my homework now.',why:'Now là dấu hiệu thường gặp của hiện tại tiếp diễn; am + V-ing.'},
{type:'Comparative adjectives',vi:'So sánh hơn',sentence:'My brother is taller than me.',why:'Taller than dùng để so sánh hơn giữa hai người.'},
{type:'Comparative adjectives',vi:'So sánh hơn',sentence:'This exercise is more difficult than that one.',why:'Tính từ dài dùng more + adjective + than.'},
{type:'Modal verbs: must / mustn’t',vi:'Động từ khuyết thiếu must / mustn’t',sentence:'You must wear a helmet.',why:'Must diễn tả điều bắt buộc.'},
{type:'Modal verbs: must / mustn’t',vi:'Động từ khuyết thiếu must / mustn’t',sentence:'You mustn’t run in the hallway.',why:'Mustn’t diễn tả điều không được phép.'},
{type:'Modal verbs: should / shouldn’t',vi:'Động từ khuyết thiếu should / shouldn’t',sentence:'We should help our friends.',why:'Should dùng để đưa ra lời khuyên.'},
{type:'Modal verbs: should / shouldn’t',vi:'Động từ khuyết thiếu should / shouldn’t',sentence:'You shouldn’t stay up too late.',why:'Shouldn’t dùng để khuyên không nên làm gì.'},
{type:'There is / There are',vi:'Cấu trúc There is / There are',sentence:'There are three books on the table.',why:'There are đi với danh từ số nhiều.'},
{type:'Prepositions of place',vi:'Giới từ chỉ vị trí',sentence:'The cat is under the chair.',why:'Under là giới từ chỉ vị trí, nghĩa là ở bên dưới.'},
{type:'Possessive ’s',vi:'Sở hữu cách',sentence:'This is my sister’s bicycle.',why:'’s diễn tả sự sở hữu.'},
{type:'Some / any',vi:'Some / any',sentence:'I have some oranges, but I don’t have any apples.',why:'Some thường dùng trong câu khẳng định; any thường dùng trong câu phủ định.'}
];
let GG;
function grammarGameStart(){stopAll();GG={l:sh(GRAMMAR_ROUNDS).slice(0,10),i:0,score:0,miss:0,done:false,opts:[]};grammarGameView()}
function grammarGameView(){if(GG.i>=GG.l.length){app.innerHTML=`<div class="card" style="text-align:center"><div class="score">🗣️</div><h2>Hoàn thành!</h2><p>Điểm: <b>${GG.score}/${GG.l.length}</b> · Sai: ${GG.miss}</p><div class="row"><button class="btn" onclick="grammarGameStart()">Chơi lại</button>${back}</div></div>`;return}const q=GG.l[GG.i];if(!GG.opts.length){const pool=[...new Set(GRAMMAR_ROUNDS.map(x=>x.type))].filter(x=>x!==q.type);GG.opts=sh([q.type,...sh(pool).slice(0,3)])}app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><span class="pill">🗣️ Câu ${GG.i+1}/${GG.l.length}</span><span class="muted">Điểm ${GG.score} · Sai ${GG.miss}</span></div><p class="muted">Nghe câu tiếng Anh, sau đó chọn cấu trúc ngữ pháp được sử dụng.</p><div class="picture" style="display:block;text-align:center;padding:20px;font-size:1rem"><div style="font-size:2.5rem">🎙️</div><p style="font-size:1.25rem;font-weight:700">${q.sentence}</p><button class="btn alt" onclick="speak(GG.l[GG.i].sentence,'en-US')">🔊 Nghe câu</button></div>${GG.opts.map((x,j)=>`<button class="opt" onclick="grammarPick(${j})">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}<div id="ggfb"></div><div class="row">${GG.done?`<button class="btn" onclick="grammarNext()">Câu tiếp →</button>`:''}${back}</div></div>`}
function grammarPick(j){if(GG.done)return;const q=GG.l[GG.i],ok=GG.opts[j]===q.type;GG.done=true;if(ok)GG.score++;else GG.miss++;document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(GG.opts[i]===q.type)b.classList.add('ok');else if(i===j)b.classList.add('bad')});$('#ggfb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'✅ Chính xác!':'❌ Đáp án đúng: '}<b>${q.vi}</b><br>${q.why}</div>`;const row=document.querySelector('.card .row');if(row)row.innerHTML=`<button class="btn" onclick="grammarNext()">Câu tiếp →</button>${back}`;if(ok)speak(q.sentence,'en-US')}

/* Bắt xe buýt */
let B;
function busStart(){
  stopAll();B={l:sh(words(gu)).slice(0,10),i:0,score:0,lives:3,lane:1,phase:'run',x:0,buses:[],to:0};
  const key=e=>{if(e.key==='ArrowUp'){busLane(-1);e.preventDefault()}else if(e.key==='ArrowDown'){busLane(1);e.preventDefault()}};
  document.addEventListener('keydown',key);
  let last=performance.now(),raf;
  const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;busTick(dt);raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  stopFn=()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',key);clearTimeout(B.to)};
  busRound();
}
function busHead(){const h=$('#bh');if(h)h.innerHTML=`<span class="pill">${gu?'Unit '+gu:'Tất cả'}</span><span class="muted">Lượt ${Math.min(B.i+1,B.l.length)}/${B.l.length} · Điểm ${B.score} · ${'❤️'.repeat(B.lives)||'💔'}</span>`}
function busRound(){
  if(B.i>=B.l.length||B.lives<=0)return busEnd();
  const w=B.l[B.i],dir=Math.random()<.5,key=dir?'vi':'en',show=dir?'en':'vi',ds=[];
  for(const x of sh(words(gu))){if(ds.length<2&&x.en!==w.en&&x[key]!==w[key]&&!ds.some(y=>y[key]===x[key]))ds.push(x)}
  const ln=sh([0,1,2]);
  B.buses=[{lane:ln[0],label:w[key],ok:1},{lane:ln[1],label:ds[0][key],ok:0},{lane:ln[2],label:ds[1][key],ok:0}].map(b=>({...b,st:Math.floor(Math.random()*100),done:0}));
  B.q=w;B.phase='run';
  app.innerHTML=`<div class="card"><div id="bh" style="display:flex;justify-content:space-between"></div>
  <p class="muted" style="margin:6px 0">Bạn là từ <b>“${w[show]}”</b>. Đứng đúng làn để lên xe có nghĩa tương ứng khi xe tới trạm (↑ ↓ hoặc chạm vào làn).</p>
  <div class="road" id="road">${[0,1,2].map(i=>`<div class="lane ${i===B.lane?'me':''}" id="ln${i}" style="top:${i*92}px" onclick="busSet(${i})"></div>`).join('')}
  <div class="stop"></div><div class="me-av" id="av" style="top:${B.lane*92+6}px"><div class="w">${w[show]}</div><div style="font-size:2rem;line-height:1.1">🧍</div></div>
  ${B.buses.map((b,k)=>`<div class="bus" id="bus${k}" style="top:${b.lane*92+24}px;left:-999px">🚌 ${b.label}</div>`).join('')}</div>
  <div class="row"><button class="btn alt" onclick="busLane(-1)">▲ Lên</button><button class="btn alt" onclick="busLane(1)">▼ Xuống</button></div><div id="bfb"></div><div class="row">${back}</div></div>`;
  B.W=$('#road').clientWidth;B.x=B.W+10;busHead();
}
function busSet(i){if(!B||B.phase!=='run')return;B.lane=i;busMark()}
function busLane(d){if(!B||B.phase!=='run')return;B.lane=Math.max(0,Math.min(2,B.lane+d));busMark()}
function busMark(){[0,1,2].forEach(i=>{const e=$('#ln'+i);if(e)e.classList.toggle('me',i===B.lane)});const a=$('#av');if(a)a.style.top=(B.lane*92+6)+'px'}
function busTick(dt){
  if(!B||B.phase!=='run'||!B.buses.length)return;
  B.x-=(125+B.i*9)*dt;let res=null;
  B.buses.forEach((b,k)=>{const el=$('#bus'+k);if(el)el.style.left=(B.x+b.st)+'px';
    if(!b.done&&B.x+b.st<=112){b.done=1;if(b.lane===B.lane&&!res)res={b,k}}});
  if(res)return busResolve(res.b,res.k);
  if(B.buses.every(b=>b.done))busResolve(null,-1);
}
function busResolve(b,k){
  B.phase='fb';const ok=b&&b.ok;
  if(ok)B.score++;else B.lives--;
  if(b){const el=$('#bus'+k);if(el)el.style.background=ok?'#69db7c':'#ff8787'}
  $('#bfb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'✅ Lên đúng xe!':'❌ Chưa đúng.'} ${B.q.en} = ${B.q.vi}</div>`;
  busHead();speak(B.q.en);
  B.to=setTimeout(()=>{B.i++;busRound()},1300);
}
function busEnd(){
  stopAll();
  app.innerHTML=`<div class="card" style="text-align:center"><div class="muted">${B.lives>0?'Hoàn thành!':'Hết lượt!'}</div><div class="score">${B.score}/${B.l.length}</div><div class="row"><button class="btn" onclick="busStart()">Chơi lại</button>${back}</div></div>`;
}

/* Bơi ghép câu */
let W2;
function swStart(){
  stopAll();const pool=SENT.filter(s=>!gu||s[0]===gu);
  W2={l:sh(pool).slice(0,5),i:0,miss:0,k:0,toks:[],opts:[]};swNew();
}
function swNew(){
  if(W2.i>=W2.l.length){app.innerHTML=`<div class="card" style="text-align:center"><div class="score">🏅</div><h2>Về đích!</h2><p>Đã ghép ${W2.l.length} câu · Chọn sai <b>${W2.miss}</b> lần</p><div class="row"><button class="btn" onclick="swStart()">Chơi lại</button>${back}</div></div>`;return}
  W2.toks=W2.l[W2.i][1].split(' ');W2.k=0;swStep();
}
function swStep(){
  const s=W2.l[W2.i],t=W2.toks,k=W2.k,done=k>=t.length;
  let opts=[];
  if(!done){
    const low=t.map(x=>x.toLowerCase());
    const pool=[...new Set(SENT.filter(x=>!gu||x[0]===gu).flatMap(x=>x[1].split(' ')))].filter(x=>!low.includes(x.toLowerCase()));
    const ds=sh(pool).slice(0,2);opts=sh([t[k],...ds]);
  }
  W2.opts=opts;
  const lefts=sh([8,38,68]),tops=sh([60,130,200]);
  app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><span class="pill">Câu ${W2.i+1}/${W2.l.length}</span><span class="muted">Sai ${W2.miss}</span></div>
  <p class="muted" style="margin:6px 0">Nghĩa: <b>${s[2]}</b>. Bơi tới từ đúng tiếp theo để ghép câu.</p>
  <div class="sent">${t.map((x,j)=>j<k?`<span class="sw">${x}</span>`:`<span class="sw" style="background:#eef0f6;color:#aab">•••</span>`).join('')}</div>
  <div class="pool"><div class="swimmer" style="left:${done?80:2+k/t.length*72}%">🏊</div>
  ${done?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;color:#0b4a73;text-align:center;padding:20px">🎉 ${s[1]}.</div>`:opts.map((o,j)=>`<button class="fw" id="fw${j}" style="left:${lefts[j]}%;top:${tops[j]}px;animation-delay:${j*.4}s" onclick="swPick(${j})">${o}</button>`).join('')}</div>
  <div class="row">${done?`<button class="btn alt" onclick="speak('${esc(s[1])}')">🔊 Nghe câu</button><button class="btn" onclick="W2.i++;swNew()">Câu tiếp →</button>`:''}${back}</div></div>`;
  if(done)speak(s[1]);
}
function swPick(j){
  if(W2.opts[j].toLowerCase()===W2.toks[W2.k].toLowerCase()){W2.k++;swStep()}
  else{W2.miss++;const e=$('#fw'+j);if(e){e.classList.add('no');e.disabled=true}const m=document.querySelector('.pill+.muted');if(m)m.textContent='Sai '+W2.miss}
}

/* Gõ chữ rơi */
let P;
function tpStart(){
  stopAll();
  app.innerHTML=`<div class="card"><h2>⌨️ Gõ chữ rơi</h2><p class="muted">Các từ sẽ rơi xuống. Gõ đúng từ tiếng Anh (có thể gõ khi từ còn đang rơi) để ghi điểm. Từ chạm đáy sẽ mất 1 ❤️. Có 5 ❤️, tối đa 20 từ.</p>
  <label><input type="checkbox" id="hard"> Chế độ khó: chỉ hiện nghĩa tiếng Việt và chữ cái đầu</label><div class="row"><button class="btn" onclick="tpGo()">Bắt đầu</button>${back}</div></div>`;
}
function tpGo(){
  const hard=$('#hard').checked;
  P={l:sh(words(gu)).slice(0,20),n:0,items:[],lives:5,score:0,hard,sp:99,gap:2.6};
  app.innerHTML=`<div class="card"><div id="th" style="display:flex;justify-content:space-between"></div><div class="sky" id="sky" style="margin:8px 0"></div>
  <input class="ans" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ từ tiếng Anh rồi chờ tự khớp…" oninput="tpType()"><div class="row">${back}</div></div>`;
  $('#tin').focus();tpHead();
  let last=performance.now(),raf;
  const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;tpTick(dt);raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);stopFn=()=>cancelAnimationFrame(raf);
}
function tpHead(){const h=$('#th');if(h)h.innerHTML=`<span class="pill">${gu?'Unit '+gu:'Tất cả'}${P.hard?' · khó':''}</span><span class="muted">Điểm ${P.score}/${P.l.length} · ${'❤️'.repeat(P.lives)||'💔'}</span>`}
function tpTick(dt){
  if(!P)return;const sky=$('#sky');if(!sky)return;const H=sky.clientHeight,W=sky.clientWidth;
  P.sp+=dt;
  if(P.n<P.l.length&&P.sp>=P.gap){
    P.sp=0;const w=P.l[P.n++],el=document.createElement('div');el.className='fl';
    el.innerHTML=`${P.hard?w.en[0]+'_'.repeat(w.en.length-1):w.en}<small>${w.vi}</small>`;sky.appendChild(el);
    const x=Math.random()*Math.max(10,W-el.offsetWidth-10);el.style.left=x+'px';el.style.top='0px';
    P.items.push({w,el,y:0});P.gap=Math.max(1.4,2.6-P.n*.06);
  }
  const v=30+P.n*1.6;
  for(const it of P.items.slice()){
    it.y+=v*dt;it.el.style.top=it.y+'px';
    if(it.y>H-it.el.offsetHeight){it.el.remove();P.items.splice(P.items.indexOf(it),1);P.lives--;tpHead()}
  }
  if(P.lives<=0||(P.n>=P.l.length&&!P.items.length))tpEnd();
}
function tpType(){
  const v=$('#tin').value.trim().toLowerCase();if(!v)return;
  const it=P.items.find(x=>x.w.en.toLowerCase()===v);
  if(it){P.score++;it.el.classList.add('hit');setTimeout(()=>it.el.remove(),250);P.items.splice(P.items.indexOf(it),1);$('#tin').value='';speak(it.w.en);tpHead()}
}
function tpEnd(){
  stopAll();const s=P.score,n=P.l.length;
  app.innerHTML=`<div class="card" style="text-align:center"><div class="muted">${P.lives>0?'Hoàn thành!':'Hết lượt!'}</div><div class="score">${s}/${n}</div><div class="row"><button class="btn" onclick="tpStart()">Chơi lại</button>${back}</div></div>`;
}

 {title:'Why urban trees matter',text:`Trees are an important part of towns and cities. They provide shade on hot days, make streets more pleasant and offer places for birds and insects to live. In areas with many buildings and roads, trees can also help lower the temperature. Their leaves provide some protection from direct sunlight, while the shade makes walking and waiting outdoors more comfortable.\n\nHowever, planting trees in a city requires careful planning. Some species need more space than others, and their roots may affect pavements or underground pipes. Young trees also need water and protection while they become established. Local authorities often work with residents to choose suitable places and species.\n\nTrees cannot solve every environmental problem, but they are one useful part of a wider plan. Cities still need clean public transport, responsible waste management and energy-efficient buildings. When communities care for trees over many years, the benefits can be shared by future generations.`,tf:[['Trees can provide shade in cities.','True'],['All tree species need exactly the same space.','False'],['The passage says trees can solve every city problem.','False']],mc:['What is the main idea?',['The value and careful planning of urban trees','How to build underground pipes','Why cities should remove parks','The history of public transport'],0]},
 {title:'The journey of household rubbish',text:`Household rubbish does not disappear when a collection truck takes it away. Different materials may follow different routes. Some items can be recycled, some can be used to produce energy in specially designed facilities, and other waste may be sent to landfill. The best choice depends on the material, local facilities and environmental rules.\n\nRecycling works well when people separate materials correctly. Paper that is wet or covered in food may not be suitable for recycling, and some containers need to be cleaned first. Local instructions are important because collection systems are not identical everywhere.\n\nThe amount of rubbish can also be reduced before collection. People can repair objects, reuse containers and choose products with less packaging. These actions do not require complicated technology. They depend mainly on thoughtful choices and convenient opportunities to reuse things.`,tf:[['All household rubbish follows the same route.','False'],['Local recycling instructions may differ.','True'],['Repairing objects can help reduce waste.','True']],mc:['Which action is mentioned as a way to reduce rubbish?',['Repairing objects','Buying extra packaging','Mixing all materials','Throwing away containers immediately'],0]}

 technology:{label:'💻 Công nghệ & khoa học',listen:[
 {title:'A science club designs a helpful device',text:`At the beginning of the school year, the science club at Hillview School decided to create a simple device that could help people save water. Their teacher showed them examples of sensors and explained how technology can collect information. The students formed small teams and discussed where water was sometimes wasted. They chose the school garden because a few plants were often watered even when the soil was already wet.\n\nThe first design used a small sensor placed in the soil. When the soil became dry, the sensor sent information to a control unit. The students hoped that the device could turn on a small pump, but their first test did not work. The sensor gave different results in different parts of the garden. The team discovered that the soil was not equally wet everywhere, so they needed to test more carefully.\n\nThey asked the school gardener for advice. He explained that some plants needed more water than others and that the device should not replace human judgement. The students changed their design so that it displayed a simple warning instead of controlling the pump automatically. A student could then check the plant and decide what to do.\n\nAfter several weeks, the club presented its model to other classes. They explained that technology can make useful information easier to understand, but people still need to make responsible decisions. The school plans to test the device during the next growing season. The students were proud that their project had improved through mistakes, questions and teamwork.`,tf:[['The club wanted to create a device to help save water.','True'],['The first sensor worked perfectly in every part of the garden.','False'],['The final design displayed a warning for a person to check.','True'],['The students believed technology should replace all human decisions.','False']],mc:['Why did the team change the device?',['The soil had different levels of moisture','The garden had no plants','The teacher cancelled the project','The sensor could not collect any information'],0]},
 {title:'How a school uses digital maps',text:`Students in a geography class were learning how people use maps to understand their local area. Their teacher introduced digital maps and showed how they could display roads, parks, public buildings and transport routes. The class discussed how this information might help a visitor find a library or help a town planner understand where more services were needed.\n\nThe students worked in groups to create a map of places around their school. They checked information carefully and learned that not every detail on the internet was correct or up to date. One group found that a bus stop had moved, while another discovered that a small public garden was missing from an older map.\n\nThe project also raised questions about privacy. The teacher reminded students not to publish personal addresses or private information. They focused on public places and used information that was appropriate for a school project. At the end, each group explained how its map could be useful and what information still needed checking.`,tf:[['The class used digital maps to study their local area.','True'],['Students were told to publish personal addresses.','False'],['Some map information was not up to date.','True']],mc:['What did the teacher remind students about?',['Protecting private information','Avoiding all maps','Using only old paper maps','Sharing passwords'],0]}

 {title:'Artificial intelligence in everyday tools',text:`Artificial intelligence, often called AI, is used in many tools that people meet every day. It can help a map suggest a route, allow a phone to recognise speech or help a website organise information. These systems work by finding patterns in data and using them to make predictions or produce results.\n\nAI can be useful, but its answers are not always correct. Information may be incomplete, old or misleading. People should check important facts instead of accepting every result immediately. It is also important to protect personal information and understand how a service uses data.\n\nIn education, AI may help students practise a language or understand a difficult idea. It should support learning rather than replace a student's own thinking. Asking questions, checking sources and explaining ideas in one's own words remain valuable skills.`,tf:[['AI is used in some everyday tools.','True'],['The passage says AI answers are always correct.','False'],['Students should use AI instead of thinking for themselves.','False']],mc:['What should people do with important AI-generated facts?',['Check them carefully','Share them without reading','Assume they are always true','Delete every source'],0]},
 {title:'A small invention with a big purpose',text:`Many useful inventions begin with someone noticing a problem. A student may see that a classroom is too noisy, that books are difficult to organise or that a plant is not receiving enough light. The first idea does not need to be perfect. It only needs to provide a starting point for investigation.\n\nDesigners often make a model before building a final product. They test it, collect feedback and make changes. Sometimes a test reveals that an idea is too expensive or difficult to use. This is not necessarily a failure; it is information that can guide the next version.\n\nA successful invention is not judged only by how complicated it looks. It should solve a real problem, be safe to use and be suitable for the people who need it. Teamwork can help because different people notice different details.`,tf:[['An invention can begin with noticing a problem.','True'],['A first model must be perfect.','False'],['Feedback can help improve a design.','True']],mc:['What is one quality of a useful invention?',['It solves a real problem','It must be very complicated','It should be expensive','It should never be tested'],0]}

 travel:{label:'✈️ Du lịch & văn hoá',listen:[
 {title:'A weekend in an old town',text:`Last month, a group of students visited the historic town of Brookdale as part of a school project. They travelled by train on Saturday morning and met their guide outside the station. The guide explained that the town had grown around a river crossing many centuries ago. Several old buildings were still standing, although some had been carefully repaired to make them safe for visitors.\n\nThe first stop was the central market. Students saw local food, handmade decorations and small shops selling traditional products. Their guide asked them to notice how the market had changed. In the past, farmers had brought most goods by cart, but today many sellers receive products by van. The market was still an important meeting place for people who lived nearby.\n\nAfter lunch, the group walked to a museum inside an old house. They learned about family life, clothing and work in the town a hundred years ago. The museum did not allow visitors to touch the objects, but students could take notes and ask questions. Later, they visited a riverside park and compared an old photograph with the view in front of them.\n\nBefore returning home, each student chose one place to recommend to a future visitor. Some preferred the museum, while others liked the market because it felt lively. Their teacher asked them to write a short travel guide that included respectful behaviour, such as asking before taking photographs of people and keeping historic places clean. The trip helped the class see that travelling is not only about visiting famous sights; it is also about learning from local communities.`,tf:[['The students travelled to Brookdale by train.','True'],['Visitors were allowed to touch objects in the museum.','False'],['The market remains a meeting place for local people.','True'],['The teacher asked students to ignore local customs.','False']],mc:['What did students have to prepare after the visit?',['A short travel guide','A new railway station','A market menu','A museum building plan'],0]},
 {title:'Choosing a responsible holiday',text:`A holiday can be enjoyable while also showing respect for the place being visited. Before travelling, people can learn about local customs, public transport and rules for natural areas. A little preparation may prevent misunderstandings and help visitors make better choices.\n\nSome travellers choose locally owned guesthouses, restaurants and shops. This can help money remain in the community. Visitors can also reduce waste by carrying a reusable bottle and following instructions about rubbish. In natural areas, they should stay on marked paths and avoid disturbing animals or plants.\n\nResponsible travel does not mean that every activity must be expensive or difficult. Walking through a town, visiting a small museum or speaking politely with local people can create meaningful experiences. The most important thing is to enjoy a destination without damaging the places and communities that make it special.`,tf:[['Learning about local customs can help visitors prepare.','True'],['Visitors should leave rubbish in natural areas.','False'],['Responsible travel must always be expensive.','False']],mc:['Which action is recommended?',['Staying on marked paths','Disturbing wild animals','Ignoring local rules','Buying only imported products'],0]}
 ],reading:[
 {title:'Festivals and community identity',text:`Festivals are important in many communities because they bring people together. Some celebrate a season or a historical event, while others are connected with music, food or local traditions. Families may prepare special dishes, decorate public spaces and invite visitors to take part in activities.\n\nA festival can also help younger people learn about their community. They may hear stories from older relatives, watch traditional performances or learn how handmade objects are produced. These experiences can keep local knowledge alive while allowing traditions to change naturally over time.\n\nVisitors should remember that a festival is more than a show for tourists. It may have a special meaning for local people. Asking politely before taking photographs and following event rules are simple ways to show respect.`,tf:[['Festivals can bring members of a community together.','True'],['The passage says traditions must never change.','False'],['Visitors should ask politely before taking some photographs.','True']],mc:['How can festivals help younger people?',['They can learn local stories and traditions','They can avoid meeting older people','They can close public spaces','They can replace all school lessons'],0]},
 {title:'Exploring a place beyond the famous sights',text:`Popular attractions often appear in travel advertisements, but a destination has much more to offer. A neighbourhood library, a local market or a small workshop may show visitors how people live and work. These places can provide a different understanding of a town than a quick visit to a famous building.\n\nWalking is one way to notice details that are easy to miss from a car. Visitors may see street art, small gardens and historic signs. However, they should plan a safe route, pay attention to traffic and respect places where people live.\n\nA thoughtful traveller does not need to visit every attraction. Choosing a few places and taking time to learn about them can make a trip more meaningful. It is also helpful to support local businesses and leave public spaces as clean as they were found.`,tf:[['A destination includes more than famous attractions.','True'],['The passage recommends ignoring traffic when walking.','False'],['Taking time to learn about a few places can be meaningful.','True']],mc:['What can a local workshop show visitors?',['How people work and make things','How to drive a bus','Why libraries should close','How to avoid local communities'],0]}
 ],write:[['A memorable trip','Write 150–180 words about a memorable trip or a place you would like to visit. Describe the location, activities, people and what makes it special.'],['A guide for visitors','Write 150–180 words giving advice to visitors to your town or city. Include places to visit, local food or customs and ways to show respect.']],speak:[['Part 1 · Places to visit','Describe a place in your area that you would recommend to a visitor. Explain what people can see and do there.'],['Part 2 · Long turn','Talk for 1–2 minutes about a cultural event, festival or tradition you know. Describe what happens, who takes part and why it is meaningful.'],['Part 3 · Discussion','How can tourism benefit a community, and what problems can it create? Give examples and suggest ways to travel responsibly.']]},
 school:{label:'🏫 Trường học & đời sống',listen:[
 {title:'Planning a student charity day',text:`Students at Maple School wanted to organise a charity day to support a community reading room. They held a meeting and invited representatives from different classes. At first, some students suggested a large concert, while others preferred a book sale. The teacher helped them compare the cost, the time needed and the number of volunteers available.\n\nThey finally decided to organise several small activities in the school hall. Students could donate books in good condition, buy handmade bookmarks and take part in short games. The art club designed posters, while the music club prepared a short performance. A group of older students created a timetable so that each activity had enough helpers.\n\nThe event took place on a Friday afternoon. It was not perfect: one table was placed too close to the entrance, and the sound system stopped working for a few minutes. The students solved these problems by moving the table and using a portable speaker. Many families attended, and the school collected more books than expected.\n\nAfter the event, the organisers counted the donations and wrote a report. They agreed that clear communication had helped the day run smoothly. They also learned that a good plan needs to include extra time and a backup idea. The teacher praised the students because they had worked together and thought about what the reading room actually needed.`,tf:[['The students compared different ideas before choosing activities.','True'],['The event took place on a Monday morning.','False'],['The organisers prepared a timetable for volunteers.','True'],['The sound system worked perfectly throughout the event.','False']],mc:['What did the students learn about planning?',['It is useful to have a backup idea','Every event must be a concert','Reports are not important','Only teachers should organise activities'],0]},
 {title:'A new student joins the class',text:`When Lin joined Class 6B in the middle of the school year, she was worried because she did not know anyone. Her classmates noticed that she was quiet during the first few lessons. Their form teacher asked two students to show her the library, the science room and the sports area. They also explained how homework was shared online.\n\nAt lunchtime, a group invited Lin to sit with them. They discovered that she enjoyed drawing and reading mystery stories. One classmate suggested that she join the art club, where students were preparing decorations for the school festival. Lin agreed, although she was still nervous about speaking in front of a large group.\n\nAfter a few weeks, Lin began to feel more comfortable. She helped design a poster and presented her group's idea to the class. She learned that asking questions and joining activities could make a new place feel more familiar. Her classmates also learned that small acts of kindness can help someone feel welcome.`,tf:[['Lin joined the class at the beginning of the school year.','False'],['Two students showed Lin important places at school.','True'],['Lin joined the art club.','True']],mc:['What helped Lin feel more comfortable?',['Taking part in activities and asking questions','Avoiding all classmates','Changing schools again','Skipping the school festival'],0]}
 ],reading:[
 {title:'Why teamwork matters in school',text:`Teamwork is a useful skill because many tasks are easier when people share ideas and responsibilities. In a group project, one student may be good at research, another may organise information and someone else may feel confident presenting the results. When everyone understands the goal, these different strengths can support the whole team.\n\nWorking together can also be challenging. Members may disagree or finish tasks at different times. A clear plan helps the group decide who is responsible for each part. Listening politely is important too, because a useful idea may come from someone who speaks less often.\n\nGood teamwork does not mean that every person does the same thing. It means that everyone contributes, communicates and respects the work of others. These habits can be useful at school and in many future situations.`,tf:[['Different strengths can support a group project.','True'],['The passage says every member must do exactly the same task.','False'],['Listening politely can help a team.','True']],mc:['What can help a group organise its work?',['A clear plan','More disagreements','Ignoring deadlines','Giving every task to one person'],0]},
 {title:'Making time for different activities',text:`A busy school week may include lessons, homework, hobbies and time with family. When students do not plan these activities, they may forget important tasks or feel that there is not enough time. A simple weekly plan can make responsibilities easier to manage.\n\nThe plan should be realistic. It can include short study periods, breaks and time for activities that help students relax. If an unexpected task appears, the schedule may need to change. Planning is not about controlling every minute; it is about understanding what needs attention and leaving some room for flexibility.\n\nStudents can review their plan at the end of the week. They may notice that one task took longer than expected or that they need more time to prepare for a subject. Small adjustments can make the next week more manageable.`,tf:[['A weekly plan can help students manage responsibilities.','True'],['The passage recommends planning every minute without breaks.','False'],['Students can adjust their plans when needed.','True']],mc:['What is the purpose of reviewing a weekly plan?',['To make useful changes for the next week','To remove all hobbies','To avoid doing homework','To make every day identical'],0]}

function chime(ac,fr,d){fr.forEach((f,i)=>{const t=ac.currentTime+d+i*.3,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1)})}

function fxStart(crowd){

 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!window._ac)window._ac=new AC();const ac=window._ac;if(ac.state==='suspended')ac.resume();
  const sr=ac.sampleRate,buf=ac.createBuffer(1,sr*2,sr),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3000;bp.Q.value=.5;
  const g=ac.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.03,ac.currentTime+.5);
  src.connect(bp);bp.connect(g);g.connect(ac.destination);src.start();
  const hum=ac.createOscillator();hum.type='sine';hum.frequency.value=110;const hg=ac.createGain();hg.gain.value=.01;hum.connect(hg);hg.connect(ac.destination);hum.start();
  const crackle=()=>{const t=ac.currentTime,s2=ac.createBufferSource(),g2=ac.createGain();s2.buffer=buf;g2.gain.setValueAtTime(.1,t);g2.gain.exponentialRampToValueAtTime(.001,t+.05);s2.connect(g2);g2.connect(ac.destination);s2.start(t,Math.random(),.06)};

  chime(ac,[784,988],0);
  const bg=ac.createGain();bg.gain.value=1;bg.connect(ac.destination);const nodes=crowd?babble(ac,buf,bg):[];_fx={ac,src,g,hum,hg,timer,bg,nodes};

function glitch(c,rate){
 const r=Math.random(),w=c.split(' ');
 if(w.length<4||r>.3)return{t:c,r:rate,v:1};
 if(r<.1)return{t:['Um...','Uh...','Hmm...'][Math.floor(Math.random()*3)]+' '+c,r:rate*.95,v:1};
 if(r<.2){const k=Math.min(w.length-2,1+Math.floor(Math.random()*3));w.splice(k,0,w[k]+'...');return{t:w.join(' '),r:rate,v:1}}

}

   out.push({t:lead+pre,r:Math.min(r*1.04,1.4),p,v,pause:0});

   if(post)out.push({t:post,r:Math.min(r*1.08,1.5),p,v,pause});else out[out.length-1].pause=pause;

  }else{

  ph.forEach((x,j)=>out.push({t:(j===0?lead:'')+x+(j<ph.length-1?',':''),r,p,v,pause:j===ph.length-1?pause:rnd(140,300)}));}
 });
